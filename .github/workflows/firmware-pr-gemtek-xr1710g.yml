name: Build Gemtek XR1710G PR firmware
# Fork-only helper for the XR1710G pull request: builds the airoha/an7581
# gemtek_xr1710g-ubi images from the PR head, checks them and publishes them
# as a pre-release, so the PR can be tested on hardware.
#
# This is the upstream-ready board support only (no carried 10G fixes), so
# the images show what the PR itself does. The upstream checks (Build Kernel,
# Build all core packages, Build PR Profile, ...) run next to it unchanged.
#
# Drop this commit before submitting the PR to openwrt/openwrt.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/firmware-pr-gemtek-xr1710g.yml'
      - 'package/boot/uboot-airoha/**'
      - 'package/boot/uboot-tools/**'
      - 'target/linux/airoha/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVICE: gemtek_xr1710g-ubi
  TARGET_DIR: bin/targets/airoha/an7581
  DTS: an7581-xr1710g-ubi
  UBOOT: an7581_gemtek_xr1710g
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PR: ${{ github.event.pull_request.number }}

jobs:
  build:
    name: airoha/an7581 gemtek_xr1710g-ubi
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h

      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Name the build
        run: |
          short=$(git rev-parse --short=10 HEAD)
          if [ -n "$PR" ]; then tag="xr1710g-pr${PR}-${short}"; else tag="xr1710g-${GITHUB_REF_NAME//\//-}-${short}"; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "build tag: $tag"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            python3-dev python3 python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget zstd ccache ecj fastjar java-propose-classpath libelf-dev \
            libncursesw5-dev libdw-dev liblz4-dev libzstd-dev libxml-parser-perl \
            device-tree-compiler

      - name: Assert the XR1710G support is in the tree
        run: |
          fail=0
          BF=target/linux/airoha/an7581/base-files
          for f in "target/linux/airoha/dts/${DTS}.dts" \
                   package/boot/uboot-airoha/patches/403-add-gemtek-xr1710g.patch; do
            [ -e "$f" ] || { echo "::error::missing $f"; fail=1; }
          done
          grep -q "^define Device/${DEVICE}$" target/linux/airoha/image/an7581.mk \
            || { echo "::error::an7581.mk has no Device/${DEVICE}"; fail=1; }
          grep -q "ARTIFACT/chainload-uboot.itb := an7581-chainloader gemtek_xr1710g$" \
            target/linux/airoha/image/an7581.mk \
            || { echo "::error::the XR1710G does not build its own chainloader"; fail=1; }
          grep -q "^define U-Boot/${UBOOT}$" package/boot/uboot-airoha/Makefile \
            || { echo "::error::uboot-airoha has no ${UBOOT} variant"; fail=1; }
          grep -qE "^	${UBOOT} \\\\$" package/boot/uboot-airoha/Makefile \
            || { echo "::error::${UBOOT} is not in UBOOT_TARGETS"; fail=1; }
          for f in "$BF/etc/board.d/01_leds" "$BF/etc/board.d/02_network" \
                   "$BF/etc/init.d/airoha_fan" \
                   "$BF/lib/upgrade/platform.sh" \
                   package/boot/uboot-tools/uboot-envtools/files/airoha_an7581; do
            grep -q 'gemtek,xr1710g-ubi' "$f" \
              || { echo "::error::$f has no gemtek,xr1710g-ubi entry"; fail=1; }
          done
          # The case branch of the board inside one function of platform.sh
          branch() {
            awk -v fn="$1" '$0 ~ "^" fn "[(]" { p=1 } p && /gemtek,xr1710g-ubi/ { f=1 } f && /;;/ { exit } f' \
              "$BF/lib/upgrade/platform.sh"
          }
          branch platform_check_image | grep -q fit_check_image \
            || { echo "::error::platform.sh does not check the FIT image of the XR1710G"; fail=1; }
          branch platform_do_upgrade | grep -q fit_do_upgrade \
            || { echo "::error::platform.sh does not use fit_do_upgrade for the XR1710G"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          echo "XR1710G support present"

      - name: Update feeds
        run: |
          # git.openwrt.org answers 504 now and then; retry from scratch.
          for i in 1 2 3 4; do
            ./scripts/feeds update -a && break
            echo "feeds update failed (attempt $i), retrying"
            rm -rf feeds
            sleep 30
          done
          ./scripts/feeds install -a

      - name: Configure build (XR1710G only)
        run: |
          {
            echo 'CONFIG_TARGET_airoha=y'
            echo 'CONFIG_TARGET_airoha_an7581=y'
            echo "CONFIG_TARGET_airoha_an7581_DEVICE_${DEVICE}=y"
            echo 'CONFIG_PACKAGE_luci=y'
            echo 'CONFIG_BUILD_LOG=y'
          } > .config
          make defconfig
          fail=0
          grep -qE "^CONFIG_TARGET(_DEVICE)?_airoha_an7581_DEVICE_${DEVICE}=y" .config \
            || { echo "::error::${DEVICE} is not selected after defconfig"; fail=1; }
          grep -qx "CONFIG_PACKAGE_u-boot-${UBOOT}=y" .config \
            || { echo "::error::u-boot-${UBOOT} is not selected - there would be no chainloader"; fail=1; }
          grep -qx 'CONFIG_PACKAGE_luci=y' .config \
            || { echo "::error::CONFIG_PACKAGE_luci did not survive defconfig"; fail=1; }
          for p in kmod-phy-realtek rtl826x-firmware kmod-mt7996e kmod-mt7996-firmware \
                   airoha-en7581-mt7996-npu-firmware kmod-hwmon-nct7802 fitblk; do
            grep -qE "^CONFIG_PACKAGE_${p}=[ym]" .config \
              || { echo "::error::${p} is not selected"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1

      - name: Download sources
        run: make download -j8

      - name: Build tools
        run: make tools/install -j$(nproc) || make tools/install -j1 V=s

      - name: Build toolchain
        run: make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

      - name: Build firmware
        run: make -j$(nproc) || make -j1 V=s

      - name: Verify the built DTB
        run: |
          KDTB=$(find build_dir -name "image-${DTS}.dtb" 2>/dev/null | head -1)
          [ -n "$KDTB" ] || { echo "::error::no image-${DTS}.dtb found in build_dir"; exit 1; }
          dtc -I dtb -O dts "$KDTB" > /tmp/xr1710g.dts 2>/dev/null \
            || { echo "::error::the DTB does not decompile"; exit 1; }
          fail=0
          grep -q 'model = "Gemtek XR1710G (UBI)"' /tmp/xr1710g.dts \
            || { echo "::error::DTB model string is wrong"; fail=1; }
          # dtc prints a string list as "a\0b\0c", so match the first entry only.
          grep -q '^	compatible = "gemtek,xr1710g-ubi\\0' /tmp/xr1710g.dts \
            || { echo "::error::DTB compatible is wrong"; fail=1; }
          for l in vendor chainloader ubi reserved_bmt; do
            grep -q "label = \"$l\"" /tmp/xr1710g.dts \
              || { echo "::error::partition $l is missing"; fail=1; }
          done
          for n in lan2 wan; do
            grep -q "openwrt,netdev-name = \"$n\"" /tmp/xr1710g.dts \
              || { echo "::error::$n is not named in the DTB"; fail=1; }
          done
          for n in lan3 lan4; do
            grep -q "label = \"$n\"" /tmp/xr1710g.dts \
              || { echo "::error::switch port $n is missing"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1
          echo "DTB describes the XR1710G"

      - name: Verify the chainloader
        run: |
          ITB=$(ls "${TARGET_DIR}"/*gemtek_xr1710g-ubi-chainload-uboot.itb 2>/dev/null | head -1)
          [ -n "$ITB" ] || { echo "::error::no chainload-uboot.itb for the XR1710G"; exit 1; }
          [ $(stat -c %s "$ITB") -le 1048576 ] \
            || { echo "::error::the chainloader does not fit the 1 MiB chainloader partition"; exit 1; }
          UDTB=$(find staging_dir -path '*/image/*' -name "${UBOOT}-u-boot.dtb" 2>/dev/null | head -1)
          [ -n "$UDTB" ] || { echo "::error::no ${UBOOT}-u-boot.dtb in staging_dir"; exit 1; }
          UBIN=$(find build_dir -path "*${UBOOT}*" -name u-boot.bin 2>/dev/null | head -1)
          [ -n "$UBIN" ] || { echo "::error::no u-boot.bin for ${UBOOT} in build_dir"; exit 1; }
          fail=0
          dtc -I dtb -O dts "$UDTB" 2>/dev/null > /tmp/uboot.dts
          grep -q 'model = "Gemtek XR1710G (UBI)"' /tmp/uboot.dts \
            || { echo "::error::U-Boot does not carry the XR1710G devicetree"; fail=1; }
          grep -q 'reg = <0x1be00000 0x4200000>' /tmp/uboot.dts \
            || { echo "::error::U-Boot does not reserve the 66 MiB vendor BMT pool"; fail=1; }
          grep -aq 'gemtek_xr1710g-ubi-initramfs-recovery.itb' "$UBIN" \
            || { echo "::error::U-Boot does not carry the XR1710G environment"; fail=1; }
          grep -aq 'check_buttons=if button reset ; then run boot_tftp_forever' "$UBIN" \
            || { echo "::error::U-Boot does not check the reset button"; fail=1; }
          grep -aq 'serverip=192.168.1.254' "$UBIN" \
            || { echo "::error::U-Boot TFTP server is not 192.168.1.254"; fail=1; }
          for c in CONFIG_PINCTRL_AIROHA_AN7581 CONFIG_BUTTON_GPIO CONFIG_CMD_BUTTON CONFIG_USE_PREBOOT; do
            grep -qx "$c=y" "$(dirname "$UBIN")/.config" \
              || { echo "::error::U-Boot is built without $c"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1
          echo "chainloader is the XR1710G U-Boot"

      - name: List output
        if: always()
        run: ls -lh "${TARGET_DIR}/" || true

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp -v "${TARGET_DIR}"/*gemtek_xr1710g* artifacts/ 2>/dev/null || true
          cp -v "${TARGET_DIR}"/sha256sums "${TARGET_DIR}"/profiles.json artifacts/ 2>/dev/null || true
          cp -v .config artifacts/build.config
          fail=0
          for f in squashfs-sysupgrade.itb initramfs-recovery.itb chainload-uboot.itb; do
            ls artifacts/ | grep -q -- "$f" || { echo "::error::no $f was produced"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub pre-release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ env.HEAD_SHA }}
          name: Gemtek XR1710G PR test build (${{ env.TAG }})
          prerelease: true
          files: artifacts/*
          body: |
            Test build of the **Gemtek / Brightspeed XR1710G** pull request
            ${{ env.PR && format('#{0}', env.PR) || '' }}, from `${{ env.HEAD_SHA }}`.

            This is the upstream-ready board support only, on plain OpenWrt main:
            it does **not** carry the community fixes for the RTL8261BE 10G links
            that the `xr1710g-rN` releases of `main-gemtek-xr1710g` have.

            Flash layout, install and revert instructions are in the commit
            "airoha: add support for Gemtek XR1710G". Do not flash over the
            naoki66 "full UBI" layout (`bl2` + `ubi` from `0x20000`).

            * `*-squashfs-sysupgrade.itb` - sysupgrade image
            * `*-initramfs-recovery.itb` - RAM-only image for the chainloader TFTP menu
            * `*-chainload-uboot.itb` - U-Boot chainloader for the `chainloader` partition

      - name: Link the release in the PR
        if: env.PR != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.release.outputs.url }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body "Firmware for \`${HEAD_SHA}\` built and published: ${URL}"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.TAG }}
          path: |
            logs/
            .config
          retention-days: 14
          if-no-files-found: ignore
