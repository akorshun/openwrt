name: Build Airpi H5000M
# Builds firmware for the Airpi / Hiveton H5000M (MT7987A + MT7992,
# mediatek/filogic) from OpenWrt v25.12.5.
#
# Device support is the upstream commit from openwrt/openwrt#24156,
# cherry-picked onto the v25.12.5 tag; upstream carries the board as
# hiveton,h5000m with Airpi H5000M as DEVICE_ALT0, so both names refer to
# the same hardware and the image files are named hiveton_h5000m.
#
# Runs only on tag pushes (or manual dispatch) — never on ordinary commits or
# pushes to the branch. Every run publishes its images as a GitHub release.
#
# The tag pattern is deliberately not 'v*': the stock github-release.yml
# inherited from upstream fires on 'v*' and would race this workflow for the
# same release.
#
# Note: the image builder cannot be used here, because the H5000M does not
# exist in the released 25.12.5 images at all, and because the mt76 patch
# below only takes effect when the packages are built from source.
#
# Builds two variants in parallel:
#   "mt76fix" - the tree as committed, i.e. with the mt7996 always-fill-TXWI
#               patch that fixes IPv4 NAT download throughput on MT7992
#   "stock"   - that patch dropped, i.e. mt76 exactly as 25.12.5 ships it
# The patch is a package patch and touches no kernel config symbol, so both
# variants share the same expected vermagic below and the same kmods feed.
#
# The build config is seeded from the official buildbot config for this
# release (.github/workflows/config/airpi-h5000m.config) so that the kernel
# config - and therefore the real module ABI - matches the official 25.12.5
# build: every CONFIG_KERNEL_* is identical, and this branch adds no kernel
# config symbols of its own (a DTS, base-files entries, an image recipe and
# a package patch), so the computed vermagic is expected to equal the
# published one on its own.
#
# The 'Force kmod vermagic' step below overrides .vermagic to the published
# value anyway, to make official kmod-* packages installable here regardless
# of any drift. This is the vermagic force that akorshun/openwrt@e67b7e7
# reverted on mediatek/filogic as unsafe; it is applied here as a deliberate,
# eyes-open choice, and is only defensible because the config match above
# keeps the real ABI delta at zero. The step after the build asserts the
# force took effect and reports what the unforced hash would have been, so a
# genuine divergence still shows up in the log instead of being hidden.

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "Verbose make (V=s)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - 'h5000m-*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Published in targets/mediatek/filogic/kmods/ for 25.12.5, and the value
  # target/linux/mediatek/filogic/base-files hardcodes into distfeeds.list.
  EXPECTED_KERNEL: 6.12.94-1
  EXPECTED_VERMAGIC: 5a6c1f71be683ae9980b15d3ce73e24d

jobs:
  build:
    name: mediatek/filogic hiveton_h5000m (${{ matrix.label }})
    runs-on: ubuntu-24.04
    # GitHub-hosted runners hard-stop at 6 h. CONFIG_ALL_KMODS=y plus the
    # debug info the buildbot config enables makes this a long build.
    timeout-minutes: 350

    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: mt76fix
            label: "with mt76 Wi-Fi NAT fix"
            wifi_fix: true
          - suffix: stock
            label: "stock mt76, no Wi-Fi fix"
            wifi_fix: false

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Drop the mt76 TXWI patch (stock variant)
        if: ${{ !matrix.wifi_fix }}
        # Removing the file is enough - OpenWrt applies whatever is in
        # package/kernel/mt76/patches - and unlike `git revert <sha>` it
        # needs no history, so the default shallow checkout is fine and the
        # step keeps working when the branch is rebased. PKG_RELEASE goes
        # back with it: the bump to 3 exists only because of this patch, and
        # a package calling itself -3 without it would be a lie to apk.
        run: |
          P=package/kernel/mt76/patches/100-mt7996-always-fill-txwi.patch
          [ -f "$P" ] || { echo "::error::$P not found - the stock variant has nothing to drop, refusing to build a mislabelled image"; exit 1; }
          rm -f "$P"
          rmdir package/kernel/mt76/patches 2>/dev/null || true
          grep -q '^PKG_RELEASE=3$' package/kernel/mt76/Makefile \
            || { echo "::error::mt76 PKG_RELEASE is not 3 - re-check what this variant is undoing"; exit 1; }
          sed -i 's/^PKG_RELEASE=3$/PKG_RELEASE=2/' package/kernel/mt76/Makefile
          echo "----- mt76 after drop -----"
          grep -n '^PKG_RELEASE' package/kernel/mt76/Makefile
          ls package/kernel/mt76/patches 2>/dev/null || echo "no patches directory (expected)"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            python3-dev python3 rsync swig unzip zlib1g-dev file wget zstd ccache \
            ecj fastjar java-propose-classpath libelf-dev libncursesw5-dev \
            libdw-dev liblz4-dev libzstd-dev libxml-parser-perl

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build (Airpi H5000M only)
        run: |
          cp .github/workflows/config/airpi-h5000m.config .config
          # Not from the buildbot config, and not a kernel config option:
          # writes per-package logs under logs/ so a failed build is
          # diagnosable from the uploaded artifact.
          echo 'CONFIG_BUILD_LOG=y' >> .config
          make defconfig

          echo "----- Selected target/device -----"
          grep -E '^CONFIG_TARGET_(mediatek|BOARD|ARCH)' .config | head -20
          grep -E '^CONFIG_TARGET.*h5000m' .config

          # `make defconfig` is free to drop anything it considers
          # unreachable, so check the seed survived before spending hours
          # on a build whose kmods would not match the official feed.
          echo "----- Kernel-ABI-relevant options -----"
          fail=0
          grep -qx 'CONFIG_ALL_KMODS=y' .config || { echo "::error::CONFIG_ALL_KMODS lost"; fail=1; }
          grep -qx 'CONFIG_COLLECT_KERNEL_DEBUG=y' .config || { echo "::error::CONFIG_COLLECT_KERNEL_DEBUG lost (selects KERNEL_DEBUG_INFO)"; fail=1; }
          grep -qx 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_hiveton_h5000m=y' .config || { echo "::error::device not selected"; fail=1; }

          # include/kernel-defaults.mk:116 copies every CONFIG_KERNEL_*
          # straight into the kernel config with the prefix stripped, so
          # each one is part of the ABI the official kmods were built
          # against. config.buildinfo is a diffconfig - anything it states
          # explicitly is a deviation from the tree defaults we would
          # otherwise share, so all of it has to be present here too.
          # BUILD_USER/BUILD_DOMAIN are the exception: they only set
          # KBUILD_BUILD_USER/HOST for the version banner, are not kernel
          # config symbols, and are deliberately left at our own values.
          curl -fsSL --retry 3 -o /tmp/config.buildinfo \
            "https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/config.buildinfo"
          { grep -E '^(# )?CONFIG_KERNEL_' /tmp/config.buildinfo \
            | grep -vE 'CONFIG_KERNEL_BUILD_(USER|DOMAIN)' || true; } > /tmp/kernel-opts.want
          echo "official CONFIG_KERNEL_* deviations:"
          cat /tmp/kernel-opts.want
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            grep -qxF "$line" .config || { echo "::error::kernel option differs from the official build: $line"; fail=1; }
          done < /tmp/kernel-opts.want

          [ "$fail" = 0 ] || exit 1
          echo "seed survived defconfig"

      - name: Force kmod vermagic to the published 25.12.5 value
        # Deliberate override, applied on top of the official-config seed
        # above (which already makes every CONFIG_KERNEL_* match). Patch the
        # .vermagic computation in include/kernel-defaults.mk so the md5 is
        # replaced by a fixed echo of the official hash - i.e. .vermagic
        # carries the published value from the moment it is written, and
        # every downstream reader (the "kernel" package, the kmod-*
        # packages, distfeeds.list) sees the same thing.
        #
        # WARNING: OpenWrt's generic/hack-6.12/204-module_strip.patch
        # compiles the kernel-side vermagic check out of check_modinfo(),
        # so once this string matches, nothing verifies that an official
        # kmod-* was actually built against a compatible kernel. That is an
        # accepted risk for this build (see the reverted vermagic pin in
        # akorshun/openwrt@e67b7e7 for the full reasoning); it is only
        # tolerable here because the kernel config otherwise matches the
        # official one. The next step reports the hash this config would
        # have produced unforced, which on this branch should be the same
        # value - if it ever is not, that log line is the warning.
        run: |
          MK=include/kernel-defaults.mk
          # Match the same token the reference hooks.sh keys on: the
          # '$(MKHASH) md5' at the end of the .vermagic pipeline. Replacing
          # it with `echo <hash>` makes that stage ignore its piped stdin
          # and write the fixed hash instead.
          grep -Fq '$(MKHASH) md5 > $(LINUX_DIR)/.vermagic' "$MK" \
            || { echo "::error::vermagic line not found in $MK - refusing to patch blindly"; exit 1; }
          sed -i 's|$(MKHASH) md5 > $(LINUX_DIR)/.vermagic|echo '"$EXPECTED_VERMAGIC"' > $(LINUX_DIR)/.vermagic|' "$MK"
          echo "----- patched line -----"
          grep -n 'vermagic' "$MK"

      - name: Download sources
        run: make download -j8

      - name: Build tools
        run: |
          make tools/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make tools/install -j1 V=s

      - name: Build toolchain
        run: |
          make toolchain/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make toolchain/install -j1 V=s

      - name: Build kernel and modules
        # No -j1 V=s retry here: with CONFIG_ALL_KMODS=y a serial rebuild
        # would not fit in the runner's 6 h budget. logs/ is uploaded on
        # failure instead (CONFIG_BUILD_LOG=y).
        run: |
          make target/linux/compile -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }}

      - name: Assert the forced vermagic took effect
        # After the force step above, .vermagic must read the published
        # value. This is a check that the patch applied - the token in
        # kernel-defaults.mk could drift in a future OpenWrt bump and the
        # sed would silently no-op. Placed here because this is the first
        # point at which .vermagic exists, and a mismatch means the
        # remaining hours would produce an image whose distfeeds.list points
        # at a kmods feed it cannot use.
        run: |
          echo "----- LINUX_VERSION / LINUX_RELEASE -----"
          make --no-print-directory val.LINUX_VERSION val.LINUX_RELEASE 2>/dev/null || true

          VM=$(find build_dir -name '.vermagic' 2>/dev/null | head -1)
          if [ -z "$VM" ]; then
            echo "::error::no .vermagic found in build_dir"
            exit 1
          fi
          ACTUAL=$(cat "$VM")
          echo "vermagic in build:  $ACTUAL"
          echo "expected (forced):  $EXPECTED_VERMAGIC"

          if [ "$ACTUAL" != "$EXPECTED_VERMAGIC" ]; then
            echo "::error::vermagic is $ACTUAL, expected $EXPECTED_VERMAGIC"
            echo "The force step did not take effect - the .vermagic line in"
            echo "include/kernel-defaults.mk probably changed shape upstream."
            echo "Re-check the sed in the 'Force kmod vermagic' step."
            exit 1
          fi
          echo "vermagic OK (forced)"

          # Informational, never fatal: recompute the hash the way
          # kernel-defaults.mk:129 would have, so the log says whether the
          # force actually changed anything. On this branch it should not -
          # no kernel config symbol is added here. A mismatch means the
          # config drifted from the official one and official kmod-*
          # packages are genuinely ABI-incompatible with this image, even
          # though the string now says otherwise.
          echo "----- what the unforced vermagic would have been -----"
          CS=$(find build_dir -path '*linux-*' -name '.config.set' 2>/dev/null | head -1)
          MKHASH=$(find staging_dir/host/bin -name 'mkhash' 2>/dev/null | head -1)
          if [ -n "$CS" ] && [ -n "$MKHASH" ]; then
            NATURAL=$(grep '=[ym]' "$CS" | LC_ALL=C sort | "$MKHASH" md5) || NATURAL=""
            echo "computed from $CS: ${NATURAL:-<failed>}"
            if [ "$NATURAL" = "$EXPECTED_VERMAGIC" ]; then
              echo "-> identical to the published value; the force was a no-op"
            elif [ -n "$NATURAL" ]; then
              echo "::warning::unforced vermagic would be $NATURAL, not $EXPECTED_VERMAGIC - the kernel config has drifted from the official 25.12.5 build, so official kmod-* packages do not actually match this kernel ABI. Use the kmods tarball shipped with this release instead."
            fi
          else
            echo "could not recompute (.config.set or mkhash not found) - skipping"
          fi

      - name: Build firmware
        run: |
          make -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }}

      - name: List output
        if: always()
        run: |
          echo "----- bin/targets/mediatek/filogic -----"
          ls -lh bin/targets/mediatek/filogic/ || true
          echo "----- disk usage -----"
          df -h

      - name: Verify the shipped kmods feed line
        run: |
          echo "----- generated distfeeds.list -----"
          DF=$(find build_dir -path '*/etc/apk/repositories.d/distfeeds.list' 2>/dev/null | head -1)
          if [ -z "$DF" ]; then
            echo "::error::generated distfeeds.list not found"
            exit 1
          fi
          cat "$DF"

          # target/linux/mediatek/filogic/base-files carries this line with a
          # hardcoded kernel version and vermagic; keep it honest.
          WANT="/targets/mediatek/filogic/kmods/${EXPECTED_KERNEL}-${EXPECTED_VERMAGIC}/packages.adb"
          if ! grep -qF "$WANT" "$DF"; then
            echo "::error::distfeeds.list does not carry $WANT"
            exit 1
          fi
          echo "kmods feed line OK"

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp -v bin/targets/mediatek/filogic/*h5000m* artifacts/ 2>/dev/null || true
          cp -v bin/targets/mediatek/filogic/sha256sums artifacts/ 2>/dev/null || true
          cp -v bin/targets/mediatek/filogic/profiles.json artifacts/ 2>/dev/null || true
          cp -v .config artifacts/build.config 2>/dev/null || true
          # CONFIG_ALL_KMODS=y means this build produced the whole kmods
          # feed itself. Ship it: same source, same config, same vermagic,
          # so it works offline and does not depend on the feed staying up.
          KDIR=$(find bin/targets/mediatek/filogic/kmods -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -1)
          if [ -n "$KDIR" ]; then
            tar -czf "artifacts/kmods-$(basename "$KDIR").tar.gz" -C "$KDIR" .
          fi
          ls -lh artifacts/

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: airpi-h5000m-firmware-${{ github.ref_name }}-${{ matrix.suffix }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && format('{0}-{1}', github.ref_name, matrix.suffix) || format('h5000m-build-{0}-{1}', github.run_number, matrix.suffix) }}
          name: Airpi H5000M ${{ github.ref_name }} (${{ matrix.label }})
          generate_release_notes: true
          files: artifacts/*

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.ref_name }}-${{ matrix.suffix }}
          path: |
            logs/
            .config
          retention-days: 14
          if-no-files-found: ignore
