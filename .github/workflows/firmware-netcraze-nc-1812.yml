name: Build Netcraze NC-1812
# Builds firmware for the Netcraze NC-1812 (MT7988D + MT7992, mediatek/filogic)
# from OpenWrt v25.12.5.
#
# Runs only on tag pushes (or manual dispatch) — never on ordinary commits or
# pushes to the branch. Every run publishes its images as a GitHub release.
#
# The tag pattern is deliberately not 'v*': the stock github-release.yml
# inherited from upstream fires on 'v*' and would race this workflow for the
# same release.
#
# Note: the image builder cannot be used here, because this branch carries
# kernel patches (FudanMicro SPI-NAND support), a DTS change (NMBM
# max-reserved-blocks) and an mt76 patch that only take effect when the
# kernel and packages are built from source.

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "Verbose make (V=s)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - 'nc1812-*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the vermagic pinned in target/linux/mediatek/Makefile and the
  # kmods feed line in target/linux/mediatek/filogic/base-files, i.e. the
  # value published in targets/mediatek/filogic/kmods/ for this release.
  EXPECTED_VERMAGIC: 5a6c1f71be683ae9980b15d3ce73e24d

jobs:
  build:
    name: mediatek/filogic netcraze_nc-1812
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            python3-dev python3 rsync swig unzip zlib1g-dev file wget zstd ccache \
            ecj fastjar java-propose-classpath libelf-dev libncursesw5-dev \
            libdw-dev liblz4-dev libzstd-dev libxml-parser-perl

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build (Netcraze NC-1812 only)
        run: |
          rm -f .config
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcraze_nc-1812=y
          CONFIG_ALL_KMODS=n
          CONFIG_ALL=n
          CONFIG_AUTOREMOVE=n
          CONFIG_LOCALMIRROR=""
          # LuCI web UI (matches official release defaults)
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          EOF
          make defconfig
          echo "----- Selected target -----"
          grep -E '^CONFIG_TARGET_(mediatek|BOARD|ARCH)' .config | head -20
          echo "----- Selected device -----"
          grep -E '^CONFIG_TARGET.*nc-1812' .config

      - name: Download sources
        run: make download -j8

      - name: Build tools
        run: |
          make tools/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make tools/install -j1 V=s

      - name: Build toolchain
        run: |
          make toolchain/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make toolchain/install -j1 V=s

      - name: Build firmware
        run: |
          make -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make -j1 V=s

      - name: List output
        if: always()
        run: |
          echo "----- bin/targets/mediatek/filogic -----"
          ls -lh bin/targets/mediatek/filogic/ || true
          echo "----- disk usage -----"
          df -h

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp -v bin/targets/mediatek/filogic/*nc-1812* artifacts/ 2>/dev/null || true
          cp -v bin/targets/mediatek/filogic/sha256sums artifacts/ 2>/dev/null || true
          cp -v bin/targets/mediatek/filogic/profiles.json artifacts/ 2>/dev/null || true
          # Include the kmod-* packages built here: they carry the same
          # vermagic as the shipped kernel by construction, so they are
          # installable on this firmware even if the pin below ever drifts.
          # Packed into a tarball so every release asset is a plain file.
          if ls bin/targets/mediatek/filogic/packages/kmod-* >/dev/null 2>&1; then
            tar -czf artifacts/kmod-packages.tar.gz \
              -C bin/targets/mediatek/filogic/packages $(cd bin/targets/mediatek/filogic/packages && ls kmod-*)
          fi
          ls -lhR artifacts/

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netcraze-nc-1812-firmware-${{ github.ref_name }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Verify pinned vermagic and kmods feed
        if: success()
        run: |
          echo "----- LINUX_VERSION / LINUX_RELEASE -----"
          make --no-print-directory val.LINUX_VERSION val.LINUX_RELEASE 2>/dev/null || true

          echo "----- staging .vermagic -----"
          find build_dir staging_dir -name '.vermagic' -print -exec cat {} \; 2>/dev/null || true

          echo "----- generated distfeeds.list -----"
          DF=$(find build_dir -path '*/etc/apk/repositories.d/distfeeds.list' 2>/dev/null | head -1)
          [ -n "$DF" ] && cat "$DF" || echo "distfeeds.list not found"

          echo "----- vermagic in a packaged kmod -----"
          KPKG=$(find bin -type f -name 'kmod-*.apk' 2>/dev/null | head -1)
          KO_VERMAGIC=""
          if [ -n "$KPKG" ]; then
            echo "pkg: $KPKG"
            mkdir -p /tmp/kpkg && tar -xf "$KPKG" -C /tmp/kpkg 2>/dev/null || true
            for ko in $(find /tmp/kpkg -name '*.ko' 2>/dev/null); do
              KO_VERMAGIC=$(strings "$ko" | grep -m1 -E '^vermagic=' || true)
              if [ -n "$KO_VERMAGIC" ]; then break; fi
            done
            echo "$KO_VERMAGIC"
          fi

          # The whole point of the pin is that kmod-* packages from the
          # official 25.12.5 feed - which distfeeds.list now points at -
          # stay installable. If the forced value did not survive, the
          # image would advertise a feed it cannot use, so refuse to
          # publish it as a release.
          VM=$(find build_dir -name '.vermagic' 2>/dev/null | head -1)
          if [ -z "$VM" ]; then
            echo "::error::no .vermagic found in build_dir"
            exit 1
          fi
          ACTUAL=$(cat "$VM")
          if [ "$ACTUAL" != "$EXPECTED_VERMAGIC" ]; then
            echo "::error::vermagic is $ACTUAL, expected $EXPECTED_VERMAGIC"
            echo "The pin in target/linux/mediatek/Makefile did not take effect;"
            echo "images from this build cannot use the official kmods feed."
            exit 1
          fi
          echo "vermagic OK: $ACTUAL"

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('nc1812-build-{0}', github.run_number) }}
          name: Netcraze NC-1812 ${{ github.ref_name }} (OpenWrt 25.12.5)
          generate_release_notes: true
          files: artifacts/*

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.ref_name }}
          path: |
            logs/
            .config
          retention-days: 14
          if-no-files-found: ignore
