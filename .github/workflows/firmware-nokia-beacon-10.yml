name: Build Nokia Beacon 10
# Builds qualcommbe/ipq95xx images for the Nokia Beacon 10 from this branch
# (OpenWrt support PR openwrt/openwrt#26129 cherry-picked onto the fork's
# main snapshot).
#
# Installs to the device eMMC tail (owrt_kernel + owrt_rootfs GPT partitions
# added from the stock firmware); the factory bootloader and system partitions
# stay untouched as a fallback. Booting uses U-Boot `mmc read` + `bootm` of the
# unsigned FIT from owrt_kernel, so both the initramfs (first boot) and the
# installed kernel boot the same way.
#
# Runs on manual dispatch and on beacon-10-* tag pushes; every run publishes
# its images as a GitHub release. The tag pattern is deliberately not 'v*':
# the stock github-release.yml inherited from upstream fires on 'v*' and would
# race this workflow for the same release.

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "Verbose make (V=s)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - 'beacon-10-*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: qualcommbe/ipq95xx nokia_beacon-10
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            python3-dev python3 rsync swig unzip zlib1g-dev file wget zstd ccache \
            ecj fastjar java-propose-classpath libelf-dev libncursesw5-dev \
            libdw-dev liblz4-dev libzstd-dev libxml-parser-perl

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build (Nokia Beacon 10 only)
        run: |
          {
            echo 'CONFIG_TARGET_qualcommbe=y'
            echo 'CONFIG_TARGET_qualcommbe_ipq95xx=y'
            echo 'CONFIG_TARGET_qualcommbe_ipq95xx_DEVICE_nokia_beacon-10=y'
            echo 'CONFIG_PACKAGE_luci=y'
            echo 'CONFIG_BUILD_LOG=y'
          } > .config
          make defconfig

          echo "----- selected target/device -----"
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|ARCH_PACKAGES)' .config || true
          grep -E 'beacon-10' .config || true

          # `make defconfig` is free to drop anything it considers unreachable,
          # so check the device survived before spending hours on a build that
          # would produce no image at all.
          grep -qE '^CONFIG_TARGET(_DEVICE)?_qualcommbe_ipq95xx_DEVICE_nokia_beacon-10=y' .config \
            || { echo "::error::nokia_beacon-10 is not selected after defconfig"; exit 1; }
          # LuCI comes from the luci feed, so it only survives defconfig once
          # the feeds are installed. If it silently dropped out the image would
          # ship without a web UI and nothing else here would notice.
          grep -qx 'CONFIG_PACKAGE_luci=y' .config \
            || { echo "::error::CONFIG_PACKAGE_luci did not survive defconfig - is the luci feed installed?"; exit 1; }
          echo "device selected, LuCI included"

      - name: Assert the Beacon 10 support is in the tree
        # Cheap source-level checks before the expensive part.
        run: |
          fail=0
          [ -f target/linux/qualcommbe/dts/ipq9574-nokia-beacon-10.dts ] \
            || { echo "::error::ipq9574-nokia-beacon-10.dts is missing"; fail=1; }
          grep -q 'nokia_beacon-10' package/firmware/ipq-wifi/Makefile \
            || { echo "::error::ipq-wifi has no nokia_beacon-10 board file"; fail=1; }
          grep -q 'nokia,beacon-10' \
            target/linux/qualcommbe/ipq95xx/base-files/lib/upgrade/platform.sh \
            || { echo "::error::platform.sh has no nokia,beacon-10 upgrade path"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          echo "beacon-10 support present in tree"

      - name: Download sources
        run: make download -j8

      - name: Build tools
        run: |
          make tools/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make tools/install -j1 V=s

      - name: Build toolchain
        run: |
          make toolchain/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make toolchain/install -j1 V=s

      - name: Build firmware
        run: |
          make -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make -j1 V=s

      - name: List output
        if: always()
        run: |
          echo "----- bin/targets/qualcommbe/ipq95xx -----"
          ls -lh bin/targets/qualcommbe/ipq95xx/ || true
          df -h

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp -v bin/targets/qualcommbe/ipq95xx/*beacon* artifacts/ 2>/dev/null || true
          cp -v bin/targets/qualcommbe/ipq95xx/sha256sums artifacts/ 2>/dev/null || true
          cp -v bin/targets/qualcommbe/ipq95xx/profiles.json artifacts/ 2>/dev/null || true
          cp -v .config artifacts/build.config 2>/dev/null || true
          ls -lh artifacts/
          ls artifacts/ | grep -q 'sysupgrade' \
            || { echo "::error::no sysupgrade image was produced"; exit 1; }
          ls artifacts/ | grep -q 'initramfs' \
            || { echo "::error::no initramfs image was produced (needed for the first boot)"; exit 1; }

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nokia-beacon-10-${{ github.ref_name }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('beacon-10-build-{0}', github.run_number) }}
          name: Nokia Beacon 10 (${{ github.ref_name }})
          files: artifacts/*
          body: |
            OpenWrt build for the **Nokia Beacon 10** (IPQ9574, qualcommbe/ipq95xx).

            Installs into the eMMC tail (`owrt_kernel` + `owrt_rootfs` GPT partitions
            created from the stock firmware); factory bootloader and system partitions
            stay intact as a fallback. Built from `${{ github.sha }}`,
            branch `main-nokia-beacon-10` (openwrt/openwrt#26129 cherry-picked).
