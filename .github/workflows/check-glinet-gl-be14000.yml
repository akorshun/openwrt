name: Check GL-BE14000 kernel + kmods (25.12)
# Fast compile check for the GL.iNet GL-BE14000 (Flint 4) branch on 25.12:
# builds the kernel, the board DTB and the out-of-tree kmods against the
# prebuilt 25.12 filogic toolchain container that OpenWrt's own CI uses.
# Takes ~10 minutes, versus 5+ hours for the full release build, so the
# realtek and yt921x ports can be iterated on cheaply.
#
# Two kernels are configured and built the same way: this branch, and a
# pristine v25.12.5 with a stock board. Their kernel configs are then
# diffed: the branch must not add or change a single =y/=m line, because
# the vermagic - and with it whether the official 25.12.5 kmods install -
# is an md5 over exactly those lines. The published vermagic itself is
# only reported here, not asserted: the container's compiler is whatever
# the 25.12 branch head builds today, and compiler-probed CONFIG_CC_HAS_*
# lines are part of the hash. The release workflow builds the toolchain
# from the tagged tree and asserts the real value.
#
# Triggered by pushing a 'gl-be14000-check-*' tag (workflow_dispatch only
# works for workflows that exist on the default branch, and this one stays
# off main on purpose). Publishes nothing; ordinary pushes to the branch
# still build nothing.

on:
  workflow_dispatch:
  push:
    tags:
      - 'gl-be14000-check-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_KERNEL: 6.12.94-1
  EXPECTED_VERMAGIC: 5a6c1f71be683ae9980b15d3ce73e24d

jobs:
  kernel:
    name: kernel (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/openwrt/toolchain:mediatek-filogic-openwrt-25.12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: branch
            ref: ${{ github.sha }}
            device: glinet_gl-be14000
          # v25.12.5 by commit: the fork does not carry every upstream tag,
          # and actions/checkout can fetch any commit reachable from the
          # branch that triggered the run.
          - name: reference
            ref: f0a60eee2fe051741c643ea6118718aae1ef17fb
            device: bananapi_bpi-r4

    steps:
      - name: Checkout the tree under test
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: openwrt

      - name: Checkout the seed config from this branch
        uses: actions/checkout@v4
        with:
          path: seed
          sparse-checkout: .github/workflows/config
          sparse-checkout-cone-mode: false

      - name: Fix permission
        # The workspace root belongs to root; the build runs as buildbot and
        # needs the tree plus a place next to it for the exported config.
        run: |
          mkdir -p kcfg
          chown -R buildbot:buildbot openwrt seed kcfg

      - name: Prepare prebuilt tools
        shell: su buildbot -c "sh -e {0}"
        working-directory: openwrt
        run: |
          mkdir -p staging_dir build_dir
          ln -s /prebuilt_tools/staging_dir/host staging_dir/host
          ln -s /prebuilt_tools/build_dir/host build_dir/host
          ./scripts/ext-tools.sh --refresh

      - name: Update and install feeds
        # The vermagic is computed from every package that carries KCONFIG,
        # feed packages included, so the package set has to be the one the
        # buildbot had.
        shell: su buildbot -c "sh -e {0}"
        working-directory: openwrt
        run: |
          # git.openwrt.org answers 504 now and then; a failed clone leaves
          # a half-empty feed behind, so retry the update from scratch.
          for i in 1 2 3 4; do
            ./scripts/feeds update -a && break
            echo "feeds update failed (attempt $i), retrying"
            rm -rf feeds
            sleep 30
          done
          ./scripts/feeds install -a

      - name: Fetch the official 25.12.5 eBPF toolchain
        # bridger compiles a BPF program; toolchain/Config.in uses a prebuilt
        # LLVM found in ./llvm-bpf instead of building tools/llvm-bpf.
        if: matrix.name == 'branch'
        shell: su buildbot -c "sh -e {0}"
        working-directory: openwrt
        run: |
          base=https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic
          curl -fsSL --retry 3 -o /tmp/sha256sums "$base/sha256sums"
          f=$(sed -n 's/^[0-9a-f]\{64\} \*\(llvm-bpf-.*\.Linux-x86_64\.tar\.zst\)$/\1/p' /tmp/sha256sums | head -1)
          [ -n "$f" ] || { echo "::error::no llvm-bpf toolchain listed in the 25.12.5 sha256sums"; exit 1; }
          curl -fsSL --retry 3 -o "/tmp/$f" "$base/$f"
          (cd /tmp && grep -F " *$f" sha256sums | sha256sum -c -)
          ZSTD=$(command -v zstd || echo staging_dir/host/bin/zstd)
          "$ZSTD" -dc "/tmp/$f" | tar -x
          rm -f "/tmp/$f"
          [ -f llvm-bpf/.llvm-version ] || { echo "::error::llvm-bpf/.llvm-version missing after extraction"; exit 1; }
          llvm-bpf/bin/clang --version | head -1

      - name: Configure external toolchain and the board
        shell: su buildbot -c "sh -e {0}"
        working-directory: openwrt
        run: |
          echo "----- toolchain in the container -----"
          ls /external-toolchain/
          rm -f .config
          ./scripts/ext-toolchain.sh \
            --toolchain /external-toolchain/$(ls /external-toolchain/ | grep openwrt-toolchain)/toolchain-* \
            --overwrite-config \
            --config mediatek/filogic
          # ext-toolchain.sh ends with its own `make defconfig`, which writes
          # every kmod out as "is not set". Those explicit lines would beat
          # the seed's CONFIG_ALL_KMODS default and leave the kernel config
          # nothing like the buildbot's, so keep only what the script decided
          # about the toolchain and libc, and let the seed drive the rest.
          grep -E '^(# )?CONFIG_(EXTERNAL_TOOLCHAIN|TOOLCHAIN_ROOT|TOOLCHAIN_PREFIX|TARGET_NAME|EXTERNAL_TOOLCHAIN_LIBC_USE_[A-Z]+|EXTERNAL_GCC_VERSION|SOFT_FLOAT|IPV6|BUILD_NLS|PACKAGE_(libc|librt|libpthread|libgcc|libstdcpp|libssp|libgfortran|libgomp|libatomic|libquadmath|libasan|libtsan|liblsan|libubsan|ldd|ldconfig)|LIB(C|RT|PTHREAD|GCC|STDCPP|SSP|GFORTRAN|GOMP|ATOMIC|QUADMATH|ASAN|TSAN|LSAN|UBSAN)_(FILE_SPEC|ROOT_DIR)|LDD_FILE_SPEC|LDCONFIG_FILE_SPEC)(=| is not set)' .config > .config.toolchain
          echo "----- toolchain lines kept -----"
          cat .config.toolchain
          # Same seed as the release build, so the kernel config - and the
          # vermagic - is the one the release will have. The reference tree
          # gets a stock board instead; with CONFIG_ALL_KMODS=y the kernel
          # config does not depend on which board is selected.
          { cat .config.toolchain
            sed 's/glinet_gl-be14000/${{ matrix.device }}/g' \
              ../seed/.github/workflows/config/glinet-gl-be14000.config
          } > .config
          make defconfig
          echo "kmods selected: $(grep -cE '^CONFIG_PACKAGE_kmod-.*=[ym]$' .config)"
          grep -qE '^CONFIG_TARGET(_DEVICE)?_mediatek_filogic_DEVICE_${{ matrix.device }}=y' .config \
            || { echo "::error::${{ matrix.device }} is not selected after defconfig"; exit 1; }
          grep -qx 'CONFIG_ALL_KMODS=y' .config || { echo "::error::CONFIG_ALL_KMODS lost"; exit 1; }
          if [ "${{ matrix.name }}" = branch ]; then
            for k in kmod-dsa-yt921x kmod-phy-yt8824; do
              grep -qx "CONFIG_PACKAGE_$k=m" .config \
                || { echo "::error::$k is not selected - is package/kernel/dsa-yt921x visible?"; exit 1; }
            done
            grep -qx 'CONFIG_USE_LLVM_PREBUILT=y' .config \
              || { echo "::error::the prebuilt eBPF toolchain is not selected"; exit 1; }
          fi
          echo "config OK"

      - name: Give the external toolchain a real info.mk
        # rules.mk reads GCC_VERSION/LIBC_* for an external toolchain from
        # staging_dir/toolchain-*/info.mk, and the tree only ever drops the
        # "unknown" template there. package/libs/toolchain then tries to
        # build libgcc1-unknown-r5.apk, which apk refuses, and every kmod
        # package depends on it.
        shell: su buildbot -c "sh -e {0}"
        working-directory: openwrt
        run: |
          GCCV=$(sed -n 's/^CONFIG_EXTERNAL_GCC_VERSION="\(.*\)"/\1/p' .config)
          MUSLV=$(sed -n 's/^PKG_VERSION:=//p' toolchain/musl/common.mk)
          PREFIX=$(sed -n 's/^CONFIG_TOOLCHAIN_PREFIX="\(.*\)"/\1/p' .config)
          TC=staging_dir/toolchain-$(sed -n 's/^CONFIG_TARGET_NAME="\(.*\)"/\1/p' .config)
          [ -n "$GCCV" ] && [ -n "$MUSLV" ] && [ -n "$PREFIX" ] || { echo "::error::could not read toolchain versions from .config"; exit 1; }
          mkdir -p "$TC"
          printf 'TARGET_CROSS=%s\nGCC_VERSION=%s\nLIBC_TYPE=musl\nLIBC_URL=http://www.musl-libc.org/\nLIBC_VERSION=%s\nLIBC_SO_VERSION=%s\n' \
            "$PREFIX" "$GCCV" "$MUSLV" "$MUSLV" > "$TC/info.mk"
          cat "$TC/info.mk"

      - name: Download kernel sources
        shell: su buildbot -c "sh -e {0}"
        working-directory: openwrt
        run: make target/linux/download -j$(nproc)

      - name: Build kernel and in-tree modules
        shell: su buildbot -c "sh -e {0}"
        working-directory: openwrt
        run: make target/linux/compile -j$(nproc) BUILD_LOG=1 || ret=$? .github/workflows/scripts/show_build_failures.sh

      - name: Report vermagic and export the kernel config
        shell: su buildbot -c "sh -e {0}"
        working-directory: openwrt
        run: |
          mkdir -p ../kcfg
          VM=$(find build_dir -name '.vermagic' 2>/dev/null | head -1)
          [ -n "$VM" ] || { echo "::error::no .vermagic found in build_dir"; exit 1; }
          KCFG=$(find build_dir -path '*linux-mediatek_filogic/linux-6.12*' -maxdepth 4 -name '.config' | head -1)
          [ -n "$KCFG" ] || { echo "::error::kernel .config not found"; exit 1; }
          cp "$KCFG" ../kcfg/kernel.config
          grep '=[ym]' "$KCFG" | LC_ALL=C sort > ../kcfg/kernel-ym.txt
          cp "$VM" ../kcfg/vermagic
          cp .config ../kcfg/openwrt.config
          { ls /external-toolchain/; cat staging_dir/toolchain-*/info.mk 2>/dev/null; } > ../kcfg/toolchain.txt || true
          echo "computed vermagic: $(cat "$VM") (published 25.12.5: $EXPECTED_VERMAGIC)"
          echo "=y/=m lines: $(wc -l < ../kcfg/kernel-ym.txt)"
          if [ "$(cat "$VM")" = "$EXPECTED_VERMAGIC" ]; then
            echo "vermagic equals the published one"
          else
            echo "::warning::vermagic differs from the published one in this container; the compare job decides whether the branch is at fault"
          fi

      - name: Upload kernel config
        uses: actions/upload-artifact@v4
        with:
          name: kcfg-${{ matrix.name }}
          path: kcfg/
          retention-days: 7
          if-no-files-found: error

      - name: Build the board DTB
        if: matrix.name == 'branch'
        shell: su buildbot -c "sh -e {0}"
        working-directory: openwrt
        run: |
          make target/linux/dtb -j$(nproc) BUILD_LOG=1 || ret=$? .github/workflows/scripts/show_build_failures.sh
          KDTB=$(find build_dir -name 'image-mt7988a-glinet-gl-be14000.dtb' 2>/dev/null | head -1)
          [ -n "$KDTB" ] || { echo "::error::image-mt7988a-glinet-gl-be14000.dtb was not produced"; exit 1; }
          for s in 'motorcomm,yt9224' 'yt922x_4b' '10gbase-r' 'mediatek,force-fixed-10g'; do
            strings "$KDTB" | grep -qx "$s" || { echo "::error::DTB has no '$s' string"; exit 1; }
          done
          echo "DTB OK: $KDTB"

      - name: Build the out-of-tree kmods and firmware
        if: matrix.name == 'branch'
        shell: su buildbot -c "sh -e {0}"
        working-directory: openwrt
        run: |
          # -k: keep compiling the other objects after one fails, so a single
          # run reports every error in the out-of-tree sources.
          make -k package/kernel/dsa-yt921x/compile -j$(nproc) BUILD_LOG=1 V=sc || ret=$? .github/workflows/scripts/show_build_failures.sh
          make package/firmware/rtl8261c-firmware/compile -j$(nproc) BUILD_LOG=1 || ret=$? .github/workflows/scripts/show_build_failures.sh
          find build_dir -path '*/dsa-yt921x/*' -name '*.ko' -exec ls -l {} \;
          for m in yt921x tag_yt921x tag_yt922x yt8824; do
            f=$(find build_dir -path '*/dsa-yt921x/*' -name "$m.ko" | head -1)
            [ -n "$f" ] || { echo "::error::$m.ko was not built"; exit 1; }
            staging_dir/toolchain-*/bin/*-readelf -p .modinfo "$f" 2>/dev/null | grep -E 'vermagic|alias' || true
          done

      - name: Check the realtek driver got the RTL8261C/D entry
        if: matrix.name == 'branch'
        shell: su buildbot -c "sh -e {0}"
        working-directory: openwrt
        run: |
          SRC=$(find build_dir -path '*linux-mediatek_filogic/linux-6.12*/drivers/net/phy/realtek/realtek_main.c' | head -1)
          [ -n "$SRC" ] || { echo "::error::patched realtek_main.c not found"; exit 1; }
          grep -q 'RTL8261C/D-CG 10Gbps PHY' "$SRC" || { echo "::error::RTL8261C/D-CG entry missing from realtek_main.c"; exit 1; }
          grep -q 'rtl826x_probe_with_patch(phydev,' "$SRC" \
            || { echo "::error::RTL8261C probe still requests another model's firmware first"; exit 1; }
          PCS=$(find build_dir -path '*linux-mediatek_filogic/linux-6.12*/drivers/net/pcs/pcs-mtk-usxgmii.c' | head -1)
          grep -q 'mediatek,force-fixed-10g' "$PCS" \
            || { echo "::error::USXGMII PCS does not handle mediatek,force-fixed-10g"; exit 1; }
          OBJ=$(find build_dir -path '*linux-mediatek_filogic/linux-6.12*/drivers/net/phy/realtek/realtek_main.o' | head -1)
          echo "realtek object: ${OBJ}"
          echo "realtek OK"

      - name: Check the PPE offload patches and build bridger
        if: matrix.name == 'branch'
        shell: su buildbot -c "sh -e {0}"
        working-directory: openwrt
        run: |
          KSRC=$(find build_dir -maxdepth 3 -type d -path '*linux-mediatek_filogic/linux-6.12*' | head -1)
          [ -f "$KSRC/include/linux/dsa/yt922x.h" ] || { echo "::error::<linux/dsa/yt922x.h> missing"; exit 1; }
          grep -q 'DSA_TAG_PROTO_YT922X_4B' "$KSRC/drivers/net/ethernet/mediatek/mtk_ppe_offload.c" \
            || { echo "::error::mtk_ppe_offload.c does not know the YT922x four-byte tag"; exit 1; }
          grep -qF 'mtk_flow_get_dsa_port(&idev, NULL)' "$KSRC/drivers/net/ethernet/mediatek/mtk_ppe_offload.c" \
            || { echo "::error::mtk_ppe_offload.c does not pick the conduit PPE on ingress"; exit 1; }
          grep -q 'DSA_TAG_PROTO_YT922X_4B' "$KSRC/drivers/net/ethernet/mediatek/mtk_ppe.c" \
            || { echo "::error::mtk_ppe.c does not match bridge flows behind the YT922x tag"; exit 1; }
          for o in drivers/net/ethernet/mediatek/mtk_ppe_offload.o drivers/net/ethernet/mediatek/mtk_ppe.o net/bridge/br_fdb.o; do
            [ -f "$KSRC/$o" ] || { echo "::error::$o was not built"; exit 1; }
          done
          echo "PPE offload patches compiled"
          make package/bridger/compile -j$(nproc) BUILD_LOG=1 || ret=$? .github/workflows/scripts/show_build_failures.sh
          find build_dir -path '*/bridger-*' -name 'bridger-bpf.o' | grep -q . \
            || { echo "::error::bridger-bpf.o was not built"; exit 1; }
          # Print the hash of the source tarball the tree just made, the
          # value PKG_MIRROR_HASH needs after a bump of PKG_SOURCE_VERSION.
          sha256sum dl/bridger-* 2>/dev/null || true
          echo "bridger OK"

      - name: Upload the built bridger package
        # Lets a fix be tried on the device before a full release build.
        if: matrix.name == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: bridger-package
          path: openwrt/bin/packages/*/base/bridger-*.apk
          retention-days: 7
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs-${{ matrix.name }}-${{ github.run_number }}
          path: |
            openwrt/logs/
            openwrt/.config
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  compare:
    name: kernel config must match v25.12.5
    needs: kernel
    runs-on: ubuntu-24.04
    steps:
      - name: Download both kernel configs
        uses: actions/download-artifact@v4
        with:
          pattern: kcfg-*
          path: kcfg

      - name: Diff the =y/=m lines
        run: |
          echo "reference vermagic: $(cat kcfg/kcfg-reference/vermagic)"
          echo "branch    vermagic: $(cat kcfg/kcfg-branch/vermagic)"
          echo "published vermagic: $EXPECTED_VERMAGIC"
          echo "----- toolchain (reference) -----"; cat kcfg/kcfg-reference/toolchain.txt || true
          if diff -u kcfg/kcfg-reference/kernel-ym.txt kcfg/kcfg-branch/kernel-ym.txt > ym.diff; then
            echo "kernel =y/=m lines identical to v25.12.5 - the branch adds no kernel config symbol"
          else
            echo "::error::the branch changes the kernel config relative to v25.12.5:"
            cat ym.diff
            exit 1
          fi
          if [ "$(cat kcfg/kcfg-reference/vermagic)" != "$EXPECTED_VERMAGIC" ]; then
            echo "::warning::even the pristine v25.12.5 kernel does not hash to the published vermagic in this container - compiler-probed CONFIG_CC_HAS_* lines differ from the buildbot's; the release build compiles its own toolchain and asserts the real value"
          fi
