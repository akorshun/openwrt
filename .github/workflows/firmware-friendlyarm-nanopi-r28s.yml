name: Build FriendlyElec NanoPi R28S
# Builds rockchip/armv8 images for the FriendlyElec NanoPi R28S (RK3528A) from
# this branch, which adds the board on top of the RK3528 support OpenWrt main
# already carries for the Radxa E20C and HINLINK H28K.
#
# The board is new enough that nothing about it is upstream yet: the device
# tree here is carried as a target patch rather than backported from mainline
# Linux, and U-Boot has no defconfig of its own for it, so the NanoPi Zero2
# one is reused (see package/boot/uboot-rockchip/Makefile for why that is
# enough).
#
# Runs only on tag pushes (or manual dispatch) - never on ordinary pushes to
# the branch: the upstream kernel/packages/toolchain/tools/push-containers
# workflows have this branch in branches-ignore. Every run publishes its
# images as a GitHub release.
#
# The tag pattern is deliberately not 'v*': the stock github-release.yml
# inherited from upstream fires on 'v*' and would race this workflow for the
# same release.

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "Verbose make (V=s)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - 'nanopi-r28s-*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE: friendlyarm_nanopi-r28s
  TARGET_DIR: bin/targets/rockchip/armv8
  DTS: rk3528-nanopi-r28s

jobs:
  build:
    name: rockchip/armv8 friendlyarm_nanopi-r28s
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            python3-dev python3 python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget zstd ccache ecj fastjar java-propose-classpath libelf-dev \
            libncursesw5-dev libdw-dev liblz4-dev libzstd-dev libxml-parser-perl \
            device-tree-compiler
          # uboot-rockchip sets UBOOT_USE_BINMAN, and binman needs pyelftools
          # importable by the host python. Without it the build dies in
          # `make download` on a prereq check several minutes in; fail here
          # instead, where the message points at the package.
          python3 -c 'import elftools' \
            || { echo "::error::python3-pyelftools is not importable - U-Boot binman needs it"; exit 1; }

      - name: Assert the R28S support is in the tree
        # Cheap source-level check before the expensive part.
        run: |
          fail=0
          chk() { [ -e "$1" ] || { echo "::error::missing $1"; fail=1; }; }
          PD=target/linux/rockchip/patches-6.18
          chk "$PD/166-arm64-dts-rockchip-Add-FriendlyElec-NanoPi-R28S.patch"
          chk "$PD/167-arm64-dts-rockchip-Update-LED-properties-for-NanoPi-R28S.patch"
          grep -q '^define Device/friendlyarm_nanopi-r28s$' target/linux/rockchip/image/armv8.mk \
            || { echo "::error::armv8.mk has no Device/friendlyarm_nanopi-r28s"; fail=1; }
          # The subtarget board.d ends in a `*) ucidef_set_interface_lan eth0`
          # default that sets a network object and no WAN, which then makes
          # 99-default_network bail out too. A board missing from here boots
          # with LAN only and no second port at all.
          NET=target/linux/rockchip/armv8/base-files/etc/board.d/02_network
          LEDS=target/linux/rockchip/armv8/base-files/etc/board.d/01_leds
          grep -q 'friendlyarm,nanopi-r28s' "$NET" \
            || { echo "::error::$NET has no friendlyarm,nanopi-r28s entry"; fail=1; }
          grep -q 'friendlyarm,nanopi-r28s' "$LEDS" \
            || { echo "::error::$LEDS has no friendlyarm,nanopi-r28s entry"; fail=1; }
          # ...and in the right group: LAN on the PCIe NIC, WAN on the GMAC.
          awk '/friendlyarm,nanopi-r28s/ { f=1 }
               f && /ucidef_set_interfaces_lan_wan/ { print; exit }' "$NET" \
            | grep -q "ucidef_set_interfaces_lan_wan 'eth1' 'eth0'" \
            || { echo "::error::the R28S is not in the LAN=eth1/WAN=eth0 group of $NET"; fail=1; }
          # base-files installs PLATFORM_SUBDIR over PLATFORM_DIR, so a copy at
          # the target level is silently overwritten by the armv8 one. That
          # cost a release once; do not let it happen again.
          if [ -e target/linux/rockchip/base-files/etc/board.d/02_network ]; then
            echo "::error::target-level board.d/02_network exists - armv8 shadows it, move the entry there"
            fail=1
          fi
          # Without this the build falls back to the default UBOOT_DEVICE_NAME
          # (nanopi-r28s-rk3528), for which U-Boot has no defconfig at all.
          grep -q 'UBOOT_DEVICE_NAME := nanopi-zero2-rk3528' target/linux/rockchip/image/armv8.mk \
            || { echo "::error::armv8.mk does not point the R28S at the NanoPi Zero2 U-Boot"; fail=1; }
          grep -q '^define U-Boot/nanopi-zero2-rk3528$' package/boot/uboot-rockchip/Makefile \
            || { echo "::error::uboot-rockchip has no nanopi-zero2-rk3528 variant"; fail=1; }
          grep -q '^  nanopi-zero2-rk3528 \\$' package/boot/uboot-rockchip/Makefile \
            || { echo "::error::nanopi-zero2-rk3528 is not in UBOOT_TARGETS"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          echo "R28S support present"

      - name: Update feeds
        run: |
          # git.openwrt.org answers 504 now and then; a failed clone leaves
          # a half-empty feed behind, so retry the update from scratch.
          for i in 1 2 3 4; do
            ./scripts/feeds update -a && break
            echo "feeds update failed (attempt $i), retrying"
            rm -rf feeds
            sleep 30
          done
          ./scripts/feeds install -a

      - name: Configure build (NanoPi R28S only)
        run: |
          {
            echo 'CONFIG_TARGET_rockchip=y'
            echo 'CONFIG_TARGET_rockchip_armv8=y'
            echo "CONFIG_TARGET_rockchip_armv8_DEVICE_${DEVICE}=y"
            echo 'CONFIG_PACKAGE_luci=y'
            echo 'CONFIG_BUILD_LOG=y'
          } > .config
          make defconfig

          echo "----- selected target/device -----"
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|ARCH_PACKAGES)' .config || true
          grep -E 'r28s|rk3528' .config || true

          fail=0
          # `make defconfig` is free to drop anything it considers unreachable,
          # so check the device survived before spending hours on a build that
          # would produce no image at all.
          grep -qE "^CONFIG_TARGET(_DEVICE)?_rockchip_armv8_DEVICE_${DEVICE}=y" .config \
            || { echo "::error::${DEVICE} is not selected after defconfig"; fail=1; }
          # LuCI comes from the luci feed, so it only survives defconfig once
          # the feeds are installed. If it silently dropped out the image would
          # ship without a web UI and nothing else here would notice.
          grep -qx 'CONFIG_PACKAGE_luci=y' .config \
            || { echo "::error::CONFIG_PACKAGE_luci did not survive defconfig - is the luci feed installed?"; fail=1; }
          # The second GbE port hangs off PCIe; without r8169 the board comes
          # up with one working interface and looks like a DT problem.
          grep -qE '^CONFIG_PACKAGE_kmod-r8169=[ym]' .config \
            || { echo "::error::kmod-r8169 is not selected - the PCIe GbE port would have no driver"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          echo "device selected, LuCI included, r8169 in"

      - name: Download sources
        run: make download -j8

      - name: Build tools
        run: |
          make tools/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make tools/install -j1 V=s

      - name: Build toolchain
        run: |
          make toolchain/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make toolchain/install -j1 V=s

      - name: Prepare the kernel tree
        # Applies the target patches. Doing this as its own step means a DTS
        # patch that no longer applies fails here, with a readable log, instead
        # of somewhere inside a several-hour build.
        run: |
          make target/linux/prepare -j$(nproc) V=s 2>&1 | tail -80
          KSRC=$(find build_dir/target-* -maxdepth 2 -type d -name 'linux-6.18*' | head -1)
          [ -n "$KSRC" ] || { echo "::error::prepared kernel tree not found"; exit 1; }
          DTSF="$KSRC/arch/arm64/boot/dts/rockchip/${DTS}.dts"
          [ -f "$DTSF" ] \
            || { echo "::error::${DTS}.dts is not in the prepared tree - patch 166 did not apply"; exit 1; }
          grep -q "${DTS}.dtb" "$KSRC/arch/arm64/boot/dts/rockchip/Makefile" \
            || { echo "::error::${DTS}.dtb is not in the kernel dts Makefile - the DTB would never be built"; exit 1; }
          grep -q 'led-boot = &sys_led;' "$DTSF" \
            || { echo "::error::the OpenWrt LED aliases are missing - patch 167 did not apply"; exit 1; }
          echo "both DTS patches applied"

      - name: Build firmware
        run: |
          make -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make -j1 V=s

      - name: Verify the built DTB
        # The DTB is the whole port. Check the compiled one really describes
        # this board and really enables the three things that make it useful:
        # the RGMII port, the PCIe port the second GbE hangs off, and the
        # combphy that PCIe needs.
        run: |
          KDTB=$(find build_dir -name "image-${DTS}.dtb" 2>/dev/null | head -1)
          [ -n "$KDTB" ] || KDTB=$(find build_dir -name "${DTS}.dtb" 2>/dev/null | head -1)
          [ -n "$KDTB" ] || { echo "::error::no ${DTS}.dtb found in build_dir"; exit 1; }
          echo "DTB: $KDTB"
          fail=0
          dtc -I dtb -O dts "$KDTB" > /tmp/r28s.dts 2>/dev/null \
            || { echo "::error::the DTB does not decompile"; exit 1; }

          grep -q 'model = "FriendlyElec NanoPi R28S"' /tmp/r28s.dts \
            || { echo "::error::DTB model string is wrong"; fail=1; }

          # A node that stayed "disabled" is the failure mode to catch: the
          # image still builds and boots, the port is just silently absent.
          node_ok() {
            awk -v n="$1" '
              $0 ~ "^\t*"n" \\{" { d=1 }
              d && /status = "okay"/ { found=1 }
              d && /^\t*\};/ { d=0 }
              END { exit !found }
            ' /tmp/r28s.dts
          }
          for n in "ethernet@ffbe0000" "pcie@fe000000" "phy@ffdc0000"; do
            node_ok "$n" || { echo "::error::$n is not enabled in the DTB"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1
          echo "DTB describes the R28S with gmac1, pcie and combphy enabled"

      - name: List output
        if: always()
        run: |
          echo "----- ${TARGET_DIR} -----"
          ls -lh "${TARGET_DIR}/" || true
          df -h

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp -v "${TARGET_DIR}"/*nanopi-r28s* artifacts/ 2>/dev/null || true
          cp -v "${TARGET_DIR}"/sha256sums artifacts/ 2>/dev/null || true
          cp -v "${TARGET_DIR}"/profiles.json artifacts/ 2>/dev/null || true
          cp -v .config artifacts/build.config 2>/dev/null || true
          ls -lh artifacts/
          ls artifacts/ | grep -q 'sysupgrade.img.gz' \
            || { echo "::error::no sysupgrade image was produced"; exit 1; }

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nanopi-r28s-${{ github.ref_name }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('nanopi-r28s-build-{0}', github.run_number) }}
          name: FriendlyElec NanoPi R28S (${{ github.ref_name }})
          files: artifacts/*
          body: |
            OpenWrt build for the **FriendlyElec NanoPi R28S** (Rockchip RK3528A).

            Built from `${{ github.sha }}`, branch `main-friendlyarm-nanopi-r28s`
            (OpenWrt main plus the board support).

            **Untested on hardware.** Nothing about this board is upstream yet, so
            the device tree here was written against FriendlyElec's published
            specifications and the Radxa E20C, which uses the same RK3528A with the
            same GMAC + PCIe-Ethernet topology. Boot it with a serial console
            attached the first time.

            ### Flashing

            Write `*-sysupgrade.img.gz` (gunzipped) to a microSD card and boot from
            it. The board can also be put in maskrom mode with the MASK button and
            flashed to eMMC over the USB-C port with `rkdeveloptool`.

            Serial console is the second USB-C jack, **1500000 8N1** - not 115200.

            ### What works, what does not

            * **Ethernet** - both ports. `eth0`/`eth1` order depends on probe order
              between the on-SoC GMAC (RTL8211F) and the PCIe controller (RTL8111H),
              so check which one the case labels LAN before trusting the defaults.
            * **Wi-Fi 6 / Bluetooth - not supported.** The on-board module has no
              mainline driver (it is an AIC8800-class SDIO part). The SDIO host is
              brought up in DT so an out-of-tree driver can be added later, but this
              image ships none, and there is no `wlan0`.
            * **MAC addresses are random on each boot.** Unlike the Radxa E20C this
              board has no EEPROM holding assigned MACs. Pin them in
              `/etc/config/network` until the RK3528 OTP is wired up as a source.
            * **USB** - the Type-C jack is 5 V input plus maskrom/eMMC flashing only;
              it is configured device-only. There is no USB host port.

            ### Files

            * `*-squashfs-sysupgrade.img.gz` - SD/eMMC image, also used for sysupgrade
            * `profiles.json`, `sha256sums` - build metadata

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.ref_name }}
          path: |
            logs/
            .config
          retention-days: 14
          if-no-files-found: ignore
