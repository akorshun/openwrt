name: Build Widora MangoPi M28K
# Builds rockchip/armv8 images for the Widora MangoPi M28K (RK3528) from this
# branch, which adds the board on top of the RK3528 support OpenWrt main
# already carries for the Radxa E20C and HINLINK H28K.
#
# Nothing about the board is in a Linux or U-Boot release yet. The device tree
# is Chukun Pan's pending linux-rockchip v2, carried as a target patch, and
# U-Boot gets a board target of its own (patch 109) - not generic-rk3528, which
# would leave the RTL8211F held in reset and the GMAC port dead in Linux.
#
# Runs only on tag pushes - never on ordinary pushes to the branch: the
# upstream kernel/packages/toolchain/tools/push-containers workflows have this
# branch in branches-ignore. Every run publishes its images as a GitHub
# release.
#
# The tag pattern is deliberately not 'v*': the stock github-release.yml
# inherited from upstream fires on 'v*' and would race this workflow for the
# same release.

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "Verbose make (V=s)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - 'mangopi-m28k-*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE: widora_mangopi-m28k
  TARGET_DIR: bin/targets/rockchip/armv8
  DTS: rk3528-mangopi-m28k
  UBOOT: mangopi-m28k-rk3528

jobs:
  build:
    name: rockchip/armv8 widora_mangopi-m28k
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            python3-dev python3 python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget zstd ccache ecj fastjar java-propose-classpath libelf-dev \
            libncursesw5-dev libdw-dev liblz4-dev libzstd-dev libxml-parser-perl \
            device-tree-compiler
          # uboot-rockchip sets UBOOT_USE_BINMAN, and binman needs pyelftools
          # importable by the host python. Without it the build dies in
          # `make download` on a prereq check several minutes in; fail here
          # instead, where the message points at the package.
          python3 -c 'import elftools' \
            || { echo "::error::python3-pyelftools is not importable - U-Boot binman needs it"; exit 1; }

      - name: Assert the M28K support is in the tree
        # Cheap source-level check before the expensive part.
        run: |
          fail=0
          chk() { [ -e "$1" ] || { echo "::error::missing $1"; fail=1; }; }
          PD=target/linux/rockchip/patches-6.18
          UBP=package/boot/uboot-rockchip/patches/109-board-rockchip-add-MangoPi-M28K.patch
          chk "$PD/102-arm64-dts-rockchip-Add-MangoPi-M28K.patch"
          chk "$PD/142-arm64-dts-rockchip-add-led-aliases-for-MangoPi-M28K.patch"
          chk "$UBP"
          grep -q '^define Device/widora_mangopi-m28k$' target/linux/rockchip/image/armv8.mk \
            || { echo "::error::armv8.mk has no Device/widora_mangopi-m28k"; fail=1; }
          # The subtarget board.d ends in a `*) ucidef_set_interface_lan eth0`
          # default that sets a network object and no WAN, which then makes
          # 99-default_network bail out too. A board missing from here boots
          # with LAN only and no second port at all.
          NET=target/linux/rockchip/armv8/base-files/etc/board.d/02_network
          LEDS=target/linux/rockchip/armv8/base-files/etc/board.d/01_leds
          grep -q 'widora,mangopi-m28k' "$NET" \
            || { echo "::error::$NET has no widora,mangopi-m28k entry"; fail=1; }
          grep -q 'widora,mangopi-m28k' "$LEDS" \
            || { echo "::error::$LEDS has no widora,mangopi-m28k entry"; fail=1; }
          # ...and in the right group: LAN on the GMAC, WAN on the PCIe NIC.
          awk '/widora,mangopi-m28k/ { f=1 }
               f && /ucidef_set_interfaces_lan_wan/ { print; exit }' "$NET" \
            | grep -q "ucidef_set_interfaces_lan_wan 'eth0' 'eth1'" \
            || { echo "::error::the M28K is not in the LAN=eth0/WAN=eth1 group of $NET"; fail=1; }
          # base-files installs PLATFORM_SUBDIR over PLATFORM_DIR, so a copy at
          # the target level is silently overwritten by the armv8 one.
          if [ -e target/linux/rockchip/base-files/etc/board.d/02_network ]; then
            echo "::error::target-level board.d/02_network exists - armv8 shadows it, move the entry there"
            fail=1
          fi
          # The device must boot the board U-Boot target, which releases the
          # RTL8211F reset. Its UBOOT_DEVICE_NAME defaults to exactly that name,
          # so any override (generic-rk3528 above all) is a regression.
          awk '/^define Device\/widora_mangopi-m28k$/ { f=1 } f && /^endef/ { exit } f' \
            target/linux/rockchip/image/armv8.mk | grep 'UBOOT_DEVICE_NAME' \
            | grep -vq "UBOOT_DEVICE_NAME := ${UBOOT}$" \
            && { echo "::error::the M28K device overrides UBOOT_DEVICE_NAME - it has to be ${UBOOT}"; fail=1; }
          grep -q "^define U-Boot/${UBOOT}$" package/boot/uboot-rockchip/Makefile \
            || { echo "::error::uboot-rockchip has no ${UBOOT} variant"; fail=1; }
          grep -q "^  ${UBOOT} \\\\$" package/boot/uboot-rockchip/Makefile \
            || { echo "::error::${UBOOT} is not in UBOOT_TARGETS"; fail=1; }
          grep -qx '+CONFIG_DWC_ETH_QOS=y' "$UBP" \
            || { echo "::error::the U-Boot target has no Ethernet - it would not release the PHY reset"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          echo "M28K support present"

      - name: Update feeds
        run: |
          # git.openwrt.org answers 504 now and then; a failed clone leaves
          # a half-empty feed behind, so retry the update from scratch.
          for i in 1 2 3 4; do
            ./scripts/feeds update -a && break
            echo "feeds update failed (attempt $i), retrying"
            rm -rf feeds
            sleep 30
          done
          ./scripts/feeds install -a

      - name: Configure build (MangoPi M28K only)
        run: |
          {
            echo 'CONFIG_TARGET_rockchip=y'
            echo 'CONFIG_TARGET_rockchip_armv8=y'
            echo "CONFIG_TARGET_rockchip_armv8_DEVICE_${DEVICE}=y"
            echo 'CONFIG_PACKAGE_luci=y'
            echo 'CONFIG_BUILD_LOG=y'
          } > .config
          make defconfig

          echo "----- selected target/device -----"
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|ARCH_PACKAGES)' .config || true
          grep -E 'm28k|rk3528' .config || true

          fail=0
          # `make defconfig` is free to drop anything it considers unreachable,
          # so check the device survived before spending hours on a build that
          # would produce no image at all.
          grep -qE "^CONFIG_TARGET(_DEVICE)?_rockchip_armv8_DEVICE_${DEVICE}=y" .config \
            || { echo "::error::${DEVICE} is not selected after defconfig"; fail=1; }
          grep -qx "CONFIG_PACKAGE_u-boot-${UBOOT}=y" .config \
            || { echo "::error::u-boot-${UBOOT} is not selected - the image would have no bootloader"; fail=1; }
          # LuCI comes from the luci feed, so it only survives defconfig once
          # the feeds are installed. If it silently dropped out the image would
          # ship without a web UI and nothing else here would notice.
          grep -qx 'CONFIG_PACKAGE_luci=y' .config \
            || { echo "::error::CONFIG_PACKAGE_luci did not survive defconfig - is the luci feed installed?"; fail=1; }
          # The second GbE port hangs off PCIe; without r8169 the board comes
          # up with one working interface and looks like a DT problem.
          grep -qE '^CONFIG_PACKAGE_kmod-r8169=[ym]' .config \
            || { echo "::error::kmod-r8169 is not selected - the PCIe GbE port would have no driver"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          echo "device and U-Boot selected, LuCI included, r8169 in"

      - name: Download sources
        run: make download -j8

      - name: Build tools
        run: |
          make tools/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make tools/install -j1 V=s

      - name: Build toolchain
        run: |
          make toolchain/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make toolchain/install -j1 V=s

      - name: Prepare the kernel tree
        # Applies the target patches. Doing this as its own step means a DTS
        # patch that no longer applies fails here, with a readable log, instead
        # of somewhere inside a several-hour build.
        run: |
          make target/linux/prepare -j$(nproc) V=s 2>&1 | tail -80
          KSRC=$(find build_dir/target-* -maxdepth 2 -type d -name 'linux-6.18*' | head -1)
          [ -n "$KSRC" ] || { echo "::error::prepared kernel tree not found"; exit 1; }
          DTSF="$KSRC/arch/arm64/boot/dts/rockchip/${DTS}.dts"
          [ -f "$DTSF" ] \
            || { echo "::error::${DTS}.dts is not in the prepared tree - patch 102 did not apply"; exit 1; }
          grep -q "${DTS}.dtb" "$KSRC/arch/arm64/boot/dts/rockchip/Makefile" \
            || { echo "::error::${DTS}.dtb is not in the kernel dts Makefile - the DTB would never be built"; exit 1; }
          grep -q 'led-boot = &led_work;' "$DTSF" \
            || { echo "::error::the OpenWrt LED aliases are missing - patch 142 did not apply"; exit 1; }
          echo "both DTS patches applied"

      - name: Build firmware
        run: |
          make -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make -j1 V=s

      - name: Verify the built DTB
        # The DTB is most of the port. Check the compiled one really describes
        # this board and really enables what makes it useful: the RGMII port,
        # the PCIe port the second GbE hangs off, the combphy PCIe needs, and
        # the two USB 2.0 host ports.
        run: |
          KDTB=$(find build_dir -name "image-${DTS}.dtb" 2>/dev/null | head -1)
          [ -n "$KDTB" ] || KDTB=$(find build_dir -name "${DTS}.dtb" 2>/dev/null | head -1)
          [ -n "$KDTB" ] || { echo "::error::no ${DTS}.dtb found in build_dir"; exit 1; }
          echo "DTB: $KDTB"
          fail=0
          dtc -I dtb -O dts "$KDTB" > /tmp/m28k.dts 2>/dev/null \
            || { echo "::error::the DTB does not decompile"; exit 1; }

          grep -q 'model = "MangoPi M28K"' /tmp/m28k.dts \
            || { echo "::error::DTB model string is wrong"; fail=1; }

          # A node that stayed "disabled" is the failure mode to catch: the
          # image still builds and boots, the port is just silently absent.
          node_ok() {
            awk -v n="$1" '
              $0 ~ "^\t*"n" \\{" { d=1 }
              d && /status = "okay"/ { found=1 }
              d && /^\t*\};/ { d=0 }
              END { exit !found }
            ' /tmp/m28k.dts
          }
          for n in "ethernet@ffbe0000" "pcie@fe000000" "phy@ffdc0000" \
                   "usb2phy@ffdf0000" "usb@ff100000" "usb@fe500000"; do
            node_ok "$n" || { echo "::error::$n is not enabled in the DTB"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1
          echo "DTB describes the M28K with gmac1, pcie, combphy and USB enabled"

      - name: Verify the bootloader
        # generic-rk3528 would also boot this board, and then leave the GMAC
        # port dead in Linux. Make sure the image carries the M28K target, with
        # its Ethernet driver, where the BootROM will look for it.
        run: |
          UBIN=$(find staging_dir -path '*/image/*' -name "${UBOOT}-u-boot-rockchip.bin" 2>/dev/null | head -1)
          [ -n "$UBIN" ] || { echo "::error::no ${UBOOT}-u-boot-rockchip.bin in staging_dir"; exit 1; }
          echo "U-Boot: $UBIN"
          fail=0
          grep -aq 'MangoPi M28K' "$UBIN" \
            || { echo "::error::U-Boot does not carry the M28K devicetree"; fail=1; }
          grep -aq 'eth_eqos' "$UBIN" \
            || { echo "::error::U-Boot has no EQOS Ethernet driver - the PHY reset would stay asserted"; fail=1; }
          grep -aq 'RealTek RTL8211F' "$UBIN" \
            || { echo "::error::U-Boot has no RTL8211F PHY driver"; fail=1; }

          IMG=$(ls "${TARGET_DIR}"/*mangopi-m28k*sysupgrade.img.gz 2>/dev/null | head -1)
          [ -n "$IMG" ] || { echo "::error::no sysupgrade image for the M28K"; exit 1; }
          # OpenWrt appends metadata after the gzip stream; gzip complains about
          # trailing garbage and still writes the image.
          gzip -dc "$IMG" > /tmp/m28k.img 2>/dev/null || true
          size=$(stat -c %s "$UBIN")
          dd if=/tmp/m28k.img bs=512 skip=64 2>/dev/null | head -c "$size" | cmp -s - "$UBIN" \
            || { echo "::error::the image does not carry ${UBOOT} at 32 KiB"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          echo "image boots the M28K U-Boot target, with Ethernet"

      - name: List output
        if: always()
        run: |
          echo "----- ${TARGET_DIR} -----"
          ls -lh "${TARGET_DIR}/" || true
          df -h

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp -v "${TARGET_DIR}"/*mangopi-m28k* artifacts/ 2>/dev/null || true
          cp -v "${TARGET_DIR}"/sha256sums artifacts/ 2>/dev/null || true
          cp -v "${TARGET_DIR}"/profiles.json artifacts/ 2>/dev/null || true
          cp -v .config artifacts/build.config 2>/dev/null || true
          ls -lh artifacts/
          ls artifacts/ | grep -q 'sysupgrade.img.gz' \
            || { echo "::error::no sysupgrade image was produced"; exit 1; }

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mangopi-m28k-${{ github.ref_name }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('mangopi-m28k-build-{0}', github.run_number) }}
          name: Widora MangoPi M28K (${{ github.ref_name }})
          files: artifacts/*
          body: |
            OpenWrt build for the **Widora MangoPi M28K** (Rockchip RK3528).

            Built from `${{ github.sha }}`, branch `main-widora-mangopi-m28k`
            (OpenWrt main plus the board support).

            **Not yet confirmed on hardware.** The device tree is Chukun Pan's v2
            submitted to linux-rockchip, not yet applied; U-Boot is a board target
            modelled on the HINLINK H28K. Boot it with a serial console attached
            the first time.

            ### Flashing

            Write `*-squashfs-sysupgrade.img.gz` (gunzipped) to a microSD card and
            boot from it.

            Serial console is uart0 at **1500000 8N1** - not 115200.

            ### What to expect

            * **Ethernet** - LAN is `eth0` (on-SoC GMAC, RTL8211F), WAN is `eth1`
              (RTL8111H on PCIe). Check which jack the case labels LAN before
              relying on the defaults.
            * **MAC addresses** are derived from the CID of the eMMC or microSD
              card, so they stay stable across reboots but follow the card.
            * **USB** - both USB 2.0 host ports are enabled.
            * **Wi-Fi / Bluetooth - not supported.** The AIC8800 has no driver in
              this image; the SDIO controller is enabled, nothing more.
            * **M28K Pro** (RTL8125B instead of RTL8111H) should work with the
              same image, but has not been tried.
            * The **BOOT** and **RECOVER** buttons are reported as `setup` and
              `vendor`; nothing is bound to them by default.

            ### Files

            * `*-squashfs-sysupgrade.img.gz` - SD/eMMC image, also used for sysupgrade
            * `profiles.json`, `sha256sums` - build metadata

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.ref_name }}
          path: |
            logs/
            .config
          retention-days: 14
          if-no-files-found: ignore
