name: Build GL.iNet GL-BE14000 (Flint 4) 25.12.5
# Builds mediatek/filogic images for the GL.iNet GL-BE14000 (Flint 4) from
# this branch: OpenWrt 25.12.5 plus the board support ported from John
# Crispin's (blogic) GL-BE14000 series and JiaY-shi's completion of it
# (blogic/openwrt#4) - the board itself, the RTL8261C/D-CG 10G PHY driver
# ported to 6.12, the Motorcomm YT9224 switch and YT8824 PHY drivers
# built out of tree, and WED/PPE hardware offload (code-only kernel
# patches, bridger built with the official 25.12.5 eBPF toolchain).
#
# The kernel config is seeded from the official 25.12.5 config.buildinfo and
# nothing on this branch adds a CONFIG_ symbol, so the computed vermagic must
# come out identical to the published one. It is asserted, never forced: a
# mismatch fails the run before the packages are built, because an image whose
# distfeeds.list points at a kmods feed it cannot use is worse than no image.
#
# Runs only on tag pushes (or manual dispatch) - never on ordinary pushes to
# the branch: the upstream kernel/packages/toolchain/tools/push-containers
# workflows have this branch in branches-ignore. Every run publishes its
# images as a GitHub release.
#
# The tag pattern is deliberately not 'v*': the stock github-release.yml
# inherited from upstream fires on 'v*' and would race this workflow for the
# same release.

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "Verbose make (V=s)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - 'gl-be14000-25.12.5-*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE: glinet_gl-be14000
  TARGET_DIR: bin/targets/mediatek/filogic
  # Published in targets/mediatek/filogic/kmods/ for 25.12.5. The build must
  # arrive at this value on its own; see the vermagic step below.
  EXPECTED_KERNEL: 6.12.94-1
  EXPECTED_VERMAGIC: 5a6c1f71be683ae9980b15d3ce73e24d

jobs:
  build:
    name: mediatek/filogic glinet_gl-be14000 (25.12.5)
    runs-on: ubuntu-24.04
    # GitHub-hosted runners hard-stop at 6 h. CONFIG_ALL_KMODS=y plus the
    # debug info the official config collects is what pushes this past 3 h.
    timeout-minutes: 350

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            python3-dev python3 rsync swig unzip zlib1g-dev file wget zstd ccache \
            ecj fastjar java-propose-classpath libelf-dev libncursesw5-dev \
            libdw-dev liblz4-dev libzstd-dev libxml-parser-perl

      - name: Assert the GL-BE14000 support is in the tree
        # Cheap source-level check before the expensive part.
        run: |
          fail=0
          chk() { [ -e "$1" ] || { echo "::error::missing $1"; fail=1; }; }
          chk target/linux/mediatek/dts/mt7988a-glinet-gl-be14000.dts
          chk target/linux/mediatek/patches-6.12/742-net-phy-realtek-add-5G-and-10G-PHY-support.patch
          chk target/linux/mediatek/patches-6.12/743-net-phy-realtek-add-support-for-rtl8261c.patch
          chk target/linux/mediatek/patches-6.12/744-net-phy-realtek-fix-RTL8261C-firmware-probe.patch
          chk target/linux/mediatek/patches-6.12/738-net-pcs-mtk_usxgmii-support-fixed-10G-switch-trunks.patch
          chk target/linux/mediatek/patches-6.12/745-net-ethernet-mtk_ppe_offload-set-output-device-before-VLAN-PPPoE-push.patch
          chk target/linux/mediatek/patches-6.12/746-net-ethernet-mtk_ppe-offload-flows-to-YT922x-four-byte-port-tags.patch
          chk target/linux/mediatek/patches-6.12/747-net-mediatek-ppe-match-bridge-flows-behind-the-YT922x-CPU-tag.patch
          chk target/linux/mediatek/patches-6.12/748-net-mediatek-ppe-retire-only-the-expired-bridge-subflow.patch
          chk target/linux/mediatek/patches-6.12/749-net-bridge-notify-switchdev-before-a-static-FDB-move.patch
          chk target/linux/mediatek/filogic/base-files/etc/hotplug.d/net/30-wifi-flow-offload
          chk target/linux/mediatek/filogic/base-files/etc/init.d/cpufreq
          grep -q 'MODPARAMS.mt7996e:=wed_enable=1' package/kernel/mt76/Makefile \
            || { echo "::error::mt7996e does not enable WED"; fail=1; }
          sed -n '/^define Device\/glinet_gl-be14000$/,/^endef$/p' target/linux/mediatek/image/filogic.mk \
            | grep -q bridger || { echo "::error::bridger is not in the GL-BE14000 profile"; fail=1; }
          chk package/kernel/dsa-yt921x/src/yt921x.c
          chk package/kernel/dsa-yt921x/src/tag_yt922x.c
          chk package/kernel/dsa-yt921x/src/yt8824.c
          grep -q 'yt8824_phy4: ethernet-phy@4' target/linux/mediatek/dts/mt7988a-glinet-gl-be14000.dts \
            || { echo "::error::the DTS does not describe the YT8824 PHY package at 4-7"; fail=1; }
          chk package/firmware/rtl8261c-firmware/files/rtl8261c.bin
          chk target/linux/mediatek/filogic/base-files/etc/apk/repositories.d/distfeeds.list
          grep -q '^define Device/glinet_gl-be14000$' target/linux/mediatek/image/filogic.mk \
            || { echo "::error::filogic.mk has no Device/glinet_gl-be14000"; fail=1; }
          grep -q 'glinet,gl-be14000' target/linux/mediatek/filogic/base-files/etc/board.d/02_network \
            || { echo "::error::02_network has no glinet,gl-be14000 entry"; fail=1; }
          # This branch must not touch the kernel config: that is what keeps
          # the vermagic equal to the official one. The checkout is shallow
          # and the fork carries no v25.12.5 tag, so fetch the release commit
          # by hash; the vermagic step later is the real gate.
          BASE=f0a60eee2fe051741c643ea6118718aae1ef17fb  # v25.12.5
          git fetch -q --depth=1 origin "$BASE" 2>/dev/null || true
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if git diff --quiet "$BASE" HEAD -- target/linux/mediatek/filogic/config-6.12 target/linux/generic/config-6.12; then
              echo "kernel config untouched since v25.12.5"
            else
              echo "::error::kernel config differs from v25.12.5 - the vermagic will not match"; fail=1
            fi
          else
            echo "::warning::could not fetch the v25.12.5 commit, skipping the config diff (vermagic is asserted later)"
          fi
          [ "$fail" = 0 ] || exit 1
          echo "GL-BE14000 support present"

      - name: Update feeds
        run: |
          # git.openwrt.org answers 504 now and then; a failed clone leaves
          # a half-empty feed behind, so retry the update from scratch.
          for i in 1 2 3 4; do
            ./scripts/feeds update -a && break
            echo "feeds update failed (attempt $i), retrying"
            rm -rf feeds
            sleep 30
          done
          ./scripts/feeds install -a

      - name: Fetch the official 25.12.5 eBPF toolchain
        # bridger compiles a BPF program. Without a prebuilt LLVM the tree
        # builds tools/llvm-bpf first, about 90 minutes on a hosted runner;
        # the 25.12.5 release publishes the toolchain its buildbot used, and
        # toolchain/Config.in picks it up from ./llvm-bpf. It only compiles
        # BPF objects, nothing that reaches the kernel or its config.
        run: |
          base=https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic
          curl -fsSL --retry 3 -o /tmp/sha256sums "$base/sha256sums"
          f=$(sed -n 's/^[0-9a-f]\{64\} \*\(llvm-bpf-.*\.Linux-x86_64\.tar\.zst\)$/\1/p' /tmp/sha256sums | head -1)
          [ -n "$f" ] || { echo "::error::no llvm-bpf toolchain listed in the 25.12.5 sha256sums"; exit 1; }
          curl -fsSL --retry 3 -o "/tmp/$f" "$base/$f"
          (cd /tmp && grep -F " *$f" sha256sums | sha256sum -c -)
          tar -I zstd -xf "/tmp/$f"
          rm -f "/tmp/$f"
          [ -f llvm-bpf/.llvm-version ] || { echo "::error::llvm-bpf/.llvm-version missing after extraction"; exit 1; }
          echo "llvm-bpf $(cat llvm-bpf/.llvm-version)"
          llvm-bpf/bin/clang --version | head -1

      - name: Configure build (official 25.12.5 config, GL-BE14000 only)
        run: |
          cp .github/workflows/config/glinet-gl-be14000.config .config
          echo 'CONFIG_BUILD_LOG=y' >> .config
          make defconfig

          echo "----- selected target/device -----"
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|ARCH_PACKAGES)' .config || true
          grep -E 'be14000' .config || true

          fail=0
          grep -qE "^CONFIG_TARGET(_DEVICE)?_mediatek_filogic_DEVICE_${DEVICE}=y" .config \
            || { echo "::error::${DEVICE} is not selected after defconfig"; fail=1; }
          grep -qx 'CONFIG_ALL_KMODS=y' .config || { echo "::error::CONFIG_ALL_KMODS lost"; fail=1; }
          grep -qx 'CONFIG_PACKAGE_luci=y' .config \
            || { echo "::error::CONFIG_PACKAGE_luci did not survive defconfig - is the luci feed installed?"; fail=1; }
          grep -qx 'CONFIG_PACKAGE_kmod-dsa-yt921x=m' .config \
            || { echo "::error::kmod-dsa-yt921x is not selected"; fail=1; }
          grep -qE '^CONFIG_PACKAGE_bridger=[ym]$' .config \
            || { echo "::error::bridger is not selected"; fail=1; }
          grep -qx 'CONFIG_USE_LLVM_PREBUILT=y' .config \
            || { echo "::error::the prebuilt eBPF toolchain is not used - tools/llvm-bpf would be built"; fail=1; }

          # include/kernel-defaults.mk copies every CONFIG_KERNEL_* symbol into
          # the kernel config, so each one is part of the ABI the official
          # kmods were built against. config.buildinfo is a diffconfig -
          # anything it states must be present verbatim here.
          curl -fsSL --retry 3 -o /tmp/config.buildinfo \
            "https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/config.buildinfo"
          { grep -E '^(# )?CONFIG_KERNEL_' /tmp/config.buildinfo \
            | grep -vE 'CONFIG_KERNEL_BUILD_(USER|DOMAIN)' || true; } > /tmp/kernel-opts.want
          echo "official CONFIG_KERNEL_* deviations:"
          cat /tmp/kernel-opts.want
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            grep -qxF -- "$line" .config \
              || { echo "::error::official kernel option not in our .config: $line"; fail=1; }
          done < /tmp/kernel-opts.want
          [ "$fail" = 0 ] || exit 1
          echo "device selected, LuCI included, kernel options match the buildbot"

      - name: Download sources
        run: make download -j8

      - name: Build tools
        run: |
          make tools/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make tools/install -j1 V=s

      - name: Build toolchain
        run: |
          make toolchain/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make toolchain/install -j1 V=s

      - name: Build kernel and modules
        # No -j1 V=s retry here: with CONFIG_ALL_KMODS=y a serial rebuild of
        # every module would blow the job timeout; the build log is uploaded
        # on failure instead.
        run: make target/linux/compile -j$(nproc) ${{ inputs.verbose == 'true' && 'V=s' || '' }}

      - name: Assert vermagic matches the published 25.12.5 feed
        # The kernel is configured and built by now, which is the first point
        # at which .vermagic exists - a mismatch means the remaining hours
        # would produce an image whose distfeeds.list points at a kmods feed
        # it cannot use.
        run: |
          VM=$(find build_dir -name '.vermagic' 2>/dev/null | head -1)
          [ -n "$VM" ] || { echo "::error::no .vermagic found in build_dir"; exit 1; }
          ACTUAL=$(cat "$VM")
          echo "computed vermagic: $ACTUAL"
          echo "expected vermagic: $EXPECTED_VERMAGIC"
          if [ "$ACTUAL" != "$EXPECTED_VERMAGIC" ]; then
            echo "::error::vermagic is $ACTUAL, expected $EXPECTED_VERMAGIC"
            echo "The kernel config drifted from the official one; compare against"
            echo "https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/config.buildinfo"
            exit 1
          fi
          echo "vermagic OK"

      - name: Build bridger
        # The only package that needs the eBPF toolchain: fail in minutes
        # rather than at the end of the full build.
        run: |
          make package/bridger/compile -j$(nproc) || make package/bridger/compile -j1 V=s
          find build_dir -path '*/bridger-*' -name 'bridger-bpf.o' | grep -q . \
            || { echo "::error::bridger-bpf.o was not built"; exit 1; }

      - name: Build firmware
        run: make -j$(nproc) ${{ inputs.verbose == 'true' && 'V=s' || '' }}

      - name: Verify the switch driver, the board DTB and the device rootfs
        run: |
          fail=0
          for m in yt921x tag_yt921x tag_yt922x yt8824; do
            f=$(find build_dir -path '*/dsa-yt921x/*' -name "$m.ko" 2>/dev/null | head -1)
            [ -n "$f" ] || { echo "::error::$m.ko was not built"; fail=1; }
          done
          KDTB=$(find build_dir -name 'image-mt7988a-glinet-gl-be14000.dtb' 2>/dev/null | head -1)
          if [ -z "$KDTB" ]; then
            echo "::error::kernel DTB image-mt7988a-glinet-gl-be14000.dtb not found"
            fail=1
          else
            for s in 'motorcomm,yt9224' 'yt922x_4b' '10gbase-r' 'mediatek,force-fixed-10g'; do
              strings "$KDTB" | grep -qx "$s" \
                || { echo "::error::DTB has no '$s' string"; fail=1; }
            done
          fi
          # The PPE offload for the YT9224 is code in the built-in Ethernet
          # driver; make sure the patched sources are what got compiled.
          KSRC=$(find build_dir -maxdepth 3 -type d -path '*linux-mediatek_filogic/linux-6.12*' | head -1)
          if [ -z "$KSRC" ]; then
            echo "::error::kernel build directory not found"
            fail=1
          else
            [ -f "$KSRC/include/linux/dsa/yt922x.h" ] \
              || { echo "::error::<linux/dsa/yt922x.h> is not in the kernel tree"; fail=1; }
            grep -q 'DSA_TAG_PROTO_YT922X_4B' "$KSRC/drivers/net/ethernet/mediatek/mtk_ppe_offload.c" \
              || { echo "::error::mtk_ppe_offload.c does not know the YT922x four-byte tag"; fail=1; }
            grep -qF 'mtk_flow_get_dsa_port(&idev, NULL)' "$KSRC/drivers/net/ethernet/mediatek/mtk_ppe_offload.c" \
              || { echo "::error::mtk_ppe_offload.c does not pick the conduit PPE on ingress"; fail=1; }
            grep -q 'DSA_TAG_PROTO_YT922X_4B' "$KSRC/drivers/net/ethernet/mediatek/mtk_ppe.c" \
              || { echo "::error::mtk_ppe.c does not match bridge flows behind the YT922x tag"; fail=1; }
            for o in drivers/net/ethernet/mediatek/mtk_ppe_offload.o drivers/net/ethernet/mediatek/mtk_ppe.o; do
              [ "$KSRC/$o" -nt "$KSRC/${o%.o}.c" ] \
                || { echo "::error::$o is missing or older than its source"; fail=1; }
            done
          fi
          # The manifest OpenWrt writes (include/image.mk, Image/Manifest) is
          # taken from TARGET_DIR_ORIG - the rootfs before DEVICE_PACKAGES are
          # added - and with CONFIG_TARGET_MULTI_PROFILE it is not even named
          # after the device. So it lists luci but never kmod-dsa-yt921x.
          # What goes into the image is $(KDIR)/target-dir-<id>; check the
          # files there, and generate the manifest the image really deserves.
          RD=""
          for d in $(find build_dir -maxdepth 4 -type d -name 'target-dir-*' 2>/dev/null); do
            [ -d "$d/lib/modules" ] || continue
            RD="$d"
            break
          done
          if [ -z "$RD" ]; then
            echo "::error::per-device rootfs (target-dir-*) not found"
            fail=1
          else
            echo "device rootfs: $RD"
            # The files themselves are the ground truth about what is in the
            # image, so these are the checks that fail the build.
            for f in yt921x.ko tag_yt921x.ko tag_yt922x.ko yt8824.ko; do
              find "$RD/lib/modules" -name "$f" | grep -q . \
                || { echo "::error::$f is not in the device rootfs"; fail=1; }
            done
            [ -f "$RD/lib/firmware/rtl8261c.bin" ] \
              || { echo "::error::rtl8261c.bin is not in the device rootfs"; fail=1; }
            [ -f "$RD/lib/firmware/mediatek/mt7996/mt7996_wm_233.bin" ] \
              || { echo "::error::MT7996 2/3/3 Wi-Fi firmware is not in the device rootfs"; fail=1; }
            # Hardware offload: WED for the MT7996, bridger for bridged
            # flows, and the hook that puts Wi-Fi into the flowtable.
            [ -f "$RD/lib/firmware/mediatek/mt7988/mt7988_wo_0.bin" ] \
              || { echo "::error::MT7988 WED offload (WO) firmware is not in the device rootfs"; fail=1; }
            grep -qx 'mt7996e wed_enable=1' "$RD/etc/modules.d/mt7996e" 2>/dev/null \
              || { echo "::error::/etc/modules.d/mt7996e does not enable WED: $(cat "$RD/etc/modules.d/mt7996e" 2>/dev/null)"; fail=1; }
            [ -x "$RD/usr/sbin/bridger" ] && [ -f "$RD/lib/bpf/bridger-bpf.o" ] \
              || { echo "::error::bridger is not in the device rootfs"; fail=1; }
            [ -f "$RD/etc/hotplug.d/net/30-wifi-flow-offload" ] \
              || { echo "::error::the Wi-Fi flowtable hotplug handler is not in the device rootfs"; fail=1; }
            [ -x "$RD/etc/init.d/cpufreq" ] \
              || { echo "::error::/etc/init.d/cpufreq is not in the device rootfs"; fail=1; }
            ls "$RD"/etc/rc.d/S*cpufreq >/dev/null 2>&1 \
              || echo "::warning::/etc/init.d/cpufreq is not enabled in the device rootfs"
            DEVMAN="${TARGET_DIR}/openwrt-25.12.5-mediatek-filogic-${DEVICE}.manifest"
            IPKG_INSTROOT="$RD" staging_dir/host/bin/apk --root "$RD" \
              --keys-dir "$(pwd)" --no-logfile --preserve-env \
              list --quiet --manifest --no-network --repositories-file /dev/null \
              2>/dev/null | sort | sed 's/ / - /' > "$DEVMAN" || true
            if [ -s "$DEVMAN" ]; then
              echo "device manifest: $(wc -l < "$DEVMAN") packages"
              # Only a warning: apk is being run against an offline root here,
              # and the file checks above already decided the build.
              for p in kmod-dsa-yt921x kmod-phy-yt8824 rtl8261c-firmware kmod-mt7996-233-firmware \
                       mt7988-wo-firmware bridger luci; do
                grep -q "^$p " "$DEVMAN" \
                  || echo "::warning::$p is not listed in the generated device manifest"
              done
            else
              # Not fatal: the file checks above already prove what shipped.
              echo "::warning::could not generate a per-device manifest with apk"
              rm -f "$DEVMAN"
            fi
          fi
          [ "$fail" = 0 ] || exit 1
          echo "switch driver, DTB and device rootfs OK"

      - name: Verify the shipped kmods feed line
        run: |
          DF=$(find build_dir -path '*/etc/apk/repositories.d/distfeeds.list' 2>/dev/null | head -1)
          [ -n "$DF" ] || { echo "::error::generated distfeeds.list not found"; exit 1; }
          echo "----- generated distfeeds.list -----"
          cat "$DF"
          # The static line ships a hardcoded kernel version and vermagic;
          # keep it honest.
          WANT="/targets/mediatek/filogic/kmods/${EXPECTED_KERNEL}-${EXPECTED_VERMAGIC}/packages.adb"
          grep -qF "$WANT" "$DF" || { echo "::error::distfeeds.list does not carry $WANT"; exit 1; }
          echo "kmods feed line OK"

      - name: List output
        if: always()
        run: |
          echo "----- ${TARGET_DIR} -----"
          ls -lh "${TARGET_DIR}/" || true
          df -h

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp -v "${TARGET_DIR}"/*gl-be14000* artifacts/ 2>/dev/null || true
          cp -v "${TARGET_DIR}"/*.manifest artifacts/ 2>/dev/null || true
          cp -v "${TARGET_DIR}"/sha256sums artifacts/ 2>/dev/null || true
          cp -v "${TARGET_DIR}"/profiles.json artifacts/ 2>/dev/null || true
          cp -v .config artifacts/build.config 2>/dev/null || true
          # CONFIG_ALL_KMODS=y means this build produced the whole kernel
          # module set itself. Ship it: same source, same config, same
          # vermagic, and it is the only place kmod-dsa-yt921x exists.
          # There is no local kmods/ directory - that path only exists on
          # downloads.openwrt.org, where the buildbot rsyncs them; locally
          # every package lands in ${TARGET_DIR}/packages together with the
          # apk index the feed needs.
          PKGDIR="${TARGET_DIR}/packages"
          if [ -d "$PKGDIR" ] && ls "$PKGDIR"/kmod-*.apk >/dev/null 2>&1; then
            echo "kmod packages: $(ls "$PKGDIR"/kmod-*.apk | wc -l), total $(du -sh "$PKGDIR" | cut -f1)"
            tar -czf "artifacts/kmods-${EXPECTED_KERNEL}-${EXPECTED_VERMAGIC}.tar.gz" -C "$PKGDIR" .
          else
            echo "::error::no kmod packages found under $PKGDIR"
            exit 1
          fi
          ls -lh artifacts/
          ls artifacts/ | grep -q "${DEVICE}-squashfs-sysupgrade.bin" \
            || { echo "::error::no sysupgrade image was produced"; exit 1; }
          ls artifacts/ | grep -q "${DEVICE}-squashfs-factory.bin" \
            || { echo "::error::no factory image was produced"; exit 1; }

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: glinet-gl-be14000-25.12.5-${{ github.ref_name }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('gl-be14000-25.12.5-build-{0}', github.run_number) }}
          name: GL.iNet Flint 4 (GL-BE14000) 25.12.5 (${{ github.ref_name }})
          files: artifacts/*
          body: |
            OpenWrt **25.12.5** build for the **GL.iNet Flint 4 (GL-BE14000)**, MediaTek
            MT7988A, eMMC, MT7996 Wi-Fi 7.

            Built from `${{ github.sha }}`, branch `openwrt-25.12-glinet-gl-be14000`:
            the `v25.12.5` tag plus the board support from John Crispin's (blogic)
            GL-BE14000 series and JiaY-shi's completion of it,
            https://github.com/blogic/openwrt/pull/4, ported to the stable kernel
            (6.12) and package set of 25.12.5.

            ### Ports

            | Port | Hardware | Status |
            |---|---|---|
            | `wan` | 10GbE RJ45, Realtek RTL8261D | works; RTL8261C/D probe fixed, see below |
            | `lan1`-`lan4` | 2.5GbE, Motorcomm YT9224 + YT8824 | works |
            | `lan5`-`lan8` | 1GbE, MT7988 built-in switch | works |
            | `sfp` | 10G SFP+ on the YT9224, 10GBASE-R | not confirmed on hardware yet |

            ### Hardware offload

            OpenWrt ships with flow offloading off. Turn it on in LuCI under
            **Network > Firewall > General Settings > Routing/NAT Offloading >
            Hardware flow offloading**, or with
            `uci set firewall.@defaults[0].flow_offloading=1; uci set firewall.@defaults[0].flow_offloading_hw=1; uci commit firewall; fw4 reload`.

            | Path | Offloaded by | Status |
            |---|---|---|
            | Wi-Fi <-> `wan` | WED (MT7988 + MT7996) | verified: about 1 Gbit/s both ways on 5 GHz, bypassing the CPU |
            | `lan5`-`lan8` <-> `wan` | PPE, MediaTek switch tag | stock 25.12 driver support, not tested on this board |
            | `lan1`-`lan4`, `sfp` <-> `wan` | PPE, YT9224 four-byte tag | new, not yet verified on hardware |
            | bridged Wi-Fi <-> LAN ports | `bridger` + PPE/WED | verified: both directions in hardware |

            ### Changes since the previous release

            * **WED enabled for the MT7996** (`mt7996e wed_enable=1`), with the MT7988
              WO firmware in the image. Both PCIe functions of the Wi-Fi card attach
              to WED v3.
            * **Wi-Fi interfaces join the flow offload table.** fw4 builds that table
              when the firewall loads, which at boot is before the Wi-Fi interfaces
              exist, and a restarted radio comes back as a new interface. A hotplug
              handler now reloads the firewall once they are in the bridge.
            * **PPE offload behind the YT9224.** The Ethernet driver pushes the
              switch's four-byte port tag on offloaded flows and picks the right PPE
              on ingress, ported from JiaY-shi's 6.18 series together with the
              bridge-flow lookup and a subflow expiry fix. Without it, flows from
              `lan1`-`lan4` were reported as `[HW_OFFLOAD]` in conntrack but never
              bound in hardware.
            * **`bridger`** in the image, for hardware offload of bridged flows, updated
              to the version OpenWrt main carries (its older vlan check dropped every
              flow on a bridge with vlan filtering disabled) and patched to report
              netlink errors to its caller. Without that patch a refused offload looks
              like a success, so it stopped at the YT9224 user port - which only
              offloads ACL rules - instead of falling back to the conduit, where the
              PPE takes the rule. Measured on the device afterwards: a LAN to Wi-Fi
              transfer runs entirely in hardware, both netdev counters stay at zero
              and the CPU is 96% idle.
            * **CPU at full speed.** The filogic kernel defaults to the `userspace`
              cpufreq governor, which kept the CPU at the 1.5 GHz the GL.iNet
              bootloader leaves it at. `/etc/init.d/cpufreq` now switches to
              `performance` at boot: 1.8 GHz, about 20% faster (stress-ng, one
              thread: int64 403 -> 484, matrixprod 21.7 -> 26.0).
              `/etc/init.d/cpufreq disable` restores the old behaviour.
            * Static bridge FDB moves now notify the switch of the old port.
            * All of this is code in the built-in drivers plus packages: still no
              kernel config change, so the official kmods keep working.

            ### Known issues - read before flashing

            * **Pre-production samples with 1 GiB RAM: do not flash.** The device tree
              declares the 2 GiB of retail units.
            * **6 GHz needs a country that allows it.** With the default country `00`
              the 6 GHz radio stays disabled, and with `US` it reports 0 dBm: the
              regulatory database marks the whole band no-IR there, so the AP never
              starts. Use one country for all radios that permits 6 GHz without no-IR
              (e.g. `DE`, or `RU` with channels 1-93), WPA3 (`sae` or `sae-mixed`).
            * **802.1Q VLAN and multicast offload on the switch** are not ported: they
              need new callbacks in the built-in DSA core that the official kmods were
              not built against. VLANs and multicast work in software, and flows of a
              VLAN-filtering bridge on the YT9224 stay on the software path.
            * If `kmod-mt7996e` is ever reinstalled from the official feed, WED is off
              again; add `options mt7996e wed_enable=Y` to `/etc/modules.conf`.
            * The front LCD is not driven: the panel and touch stack needs the
              `display` target feature and DRM kernel modules that the official
              25.12.5 filogic kernel does not have, and enabling them would break
              the kmod compatibility below.

            ### Official kmods work on this image

            The kernel config is seeded from the official 25.12.5 `config.buildinfo`
            and this branch adds no kernel config symbol at all, so the computed
            vermagic is the published `${{ env.EXPECTED_KERNEL }}-${{ env.EXPECTED_VERMAGIC }}`
            - asserted by the build, never forced. `/etc/apk/repositories.d/distfeeds.list`
            carries the matching kmods feed line, so `apk add kmod-*` (and LuCI's
            package manager) pulls kernel modules straight from
            downloads.openwrt.org like on an official image. `kmods-*.tar.gz` in
            this release is the module set this build produced itself, with the
            apk index, for offline use - and the only place `kmod-dsa-yt921x` and
            `kmod-phy-yt8824` (the YT9224 switch and YT8824 PHY drivers, built out
            of tree) exist. Both are already installed in the image; the archive is
            for reinstalling them later or using them on another 25.12.5 build of
            this board.

            ### What is in the image

            * Stock defaults for the board (`lan1`-`lan8` + `sfp` in the LAN bridge,
              `wan` = the 10G RJ45 port as DHCP client), Wi-Fi off until configured.
            * **LuCI** (with `luci-ssl`, attended sysupgrade and the package
              manager, as on the official 25.12.5 images) - http://192.168.1.1.
            * RTL8261D-CG 10G PHY driver with its `rtl8261c.bin` patch firmware,
              MT7996 Wi-Fi firmware, the YT9224 switch and YT8824 PHY drivers,
              USB 3, PWM fan, SFP support.
            * MT7988 WED offload firmware and `bridger`; flow offloading itself stays
              off until enabled in the firewall, as on any OpenWrt image.

            ### Files

            * `*-squashfs-factory.bin` - **first install** from the GL.iNet vendor
              firmware / U-Boot.
            * `*-squashfs-sysupgrade.bin` - upgrades from an OpenWrt build of this
              board (LuCI > System > Backup/Flash Firmware, or `sysupgrade`).
            * `*-initramfs-kernel.bin` - RAM-only image for recovery/testing, if
              present.
            * `kmods-${{ env.EXPECTED_KERNEL }}-${{ env.EXPECTED_VERMAGIC }}.tar.gz` -
              every kernel module package this build produced, plus the apk index.
            * `*-glinet_gl-be14000.manifest` - every package in the image, with
              versions. (`openwrt-25.12.5-mediatek-filogic.manifest` is the one
              OpenWrt writes itself: the shared rootfs, before this board's own
              packages are added.)
            * `sha256sums`, `profiles.json`, `build.config` - checksums, the image
              metadata and the exact `.config` used.

            ### Installing

            The vendor U-Boot loads OpenWrt from the `kernel` GPT partition and
            roots on the `rootfs` partition, so the **bootloader is left alone** and
            the vendor eMMC layout is reused. Flash `*-squashfs-factory.bin` either
            from the GL.iNet U-Boot web recovery (hold reset while powering on, then
            open http://192.168.1.1) or with `mtkupgrade fw` from the U-Boot serial
            console. Afterwards use the sysupgrade image for updates.

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.ref_name }}
          path: |
            logs/
            .config
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
