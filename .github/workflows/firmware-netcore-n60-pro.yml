name: Build Netcore N60 Pro (512M)
# Based on OpenWrt v25.12 branch.
# Note: image builder cannot be used here because this branch ships
# a custom DTS (expanded UBI partition for 512MB NAND), which only
# takes effect when the kernel is built from source.

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "Verbose make (V=s)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - openwrt-25.12-netcore-n60-pro-512m
    paths:
      - 'target/linux/mediatek/**'
      - 'package/boot/uboot-mediatek/**'
      - '.github/workflows/firmware-netcore-n60-pro.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mediatek/filogic netcore_n60-pro
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            python3-dev python3 rsync swig unzip zlib1g-dev file wget zstd ccache \
            ecj fastjar java-propose-classpath libelf-dev libncursesw5-dev \
            libdw-dev liblz4-dev libzstd-dev libxml-parser-perl

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build (Netcore N60 Pro only)
        run: |
          rm -f .config
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y
          CONFIG_ALL_KMODS=n
          CONFIG_ALL=n
          CONFIG_AUTOREMOVE=n
          CONFIG_LOCALMIRROR=""
          # LuCI web UI (matches official release defaults)
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          # Extra packages requested for this build
          CONFIG_PACKAGE_luci-i18n-base-ru=y
          CONFIG_PACKAGE_luci-i18n-firewall-ru=y
          CONFIG_PACKAGE_luci-i18n-package-manager-ru=y
          CONFIG_PACKAGE_nano-full=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-lib-ipkg=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_jsonfilter=y
          CONFIG_PACKAGE_luci-lua-runtime=y
          EOF
          make defconfig
          echo "----- Selected target -----"
          grep -E '^CONFIG_TARGET_(mediatek|BOARD|ARCH)' .config | head -20
          echo "----- Selected device -----"
          grep -E '^CONFIG_TARGET.*netcore' .config
          echo "----- Selected extra packages -----"
          grep -E '^CONFIG_PACKAGE_(luci-i18n-(base|firewall|package-manager)-ru|nano-full|htop|luci-compat|luci-lib-ipkg|curl|jsonfilter|luci-lua-runtime)=y' .config || true

      - name: Download sources
        run: make download -j8

      - name: Build tools
        run: |
          make tools/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make tools/install -j1 V=s

      - name: Build toolchain
        run: |
          make toolchain/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make toolchain/install -j1 V=s

      - name: Build firmware
        run: |
          make -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make -j1 V=s

      - name: List output
        if: always()
        run: |
          echo "----- bin/targets/mediatek/filogic -----"
          ls -lh bin/targets/mediatek/filogic/ || true
          echo "----- disk usage -----"
          df -h

      - name: Report kernel version and vermagic
        if: always()
        run: |
          echo "----- LINUX_VERSION / LINUX_RELEASE -----"
          make --no-print-directory val.LINUX_VERSION val.LINUX_RELEASE 2>/dev/null || true
          echo "----- staging .vermagic -----"
          find staging_dir -name '.vermagic' -print -exec cat {} \; 2>/dev/null || true
          echo "----- vermagic in built .ko (first match) -----"
          KO=$(find build_dir -name '*.ko' 2>/dev/null | head -1)
          if [ -n "$KO" ]; then
            echo "ko: $KO"
            strings "$KO" | grep -m1 -E '^vermagic=' || true
          fi
          echo "----- vermagic in a packaged kmod -----"
          KPKG=$(find bin -type f \( -name 'kmod-*.apk' -o -name 'kmod-*.ipk' \) 2>/dev/null | head -1)
          if [ -n "$KPKG" ]; then
            echo "pkg: $KPKG"
            mkdir -p /tmp/kpkg && (cd /tmp/kpkg && tar -xf "$GITHUB_WORKSPACE/$KPKG" 2>/dev/null || true)
            for ko in $(find /tmp/kpkg -name '*.ko' 2>/dev/null); do
              strings "$ko" | grep -m1 -E '^vermagic=' && break || true
            done
          fi

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp -v bin/targets/mediatek/filogic/*netcore*n60-pro* artifacts/ 2>/dev/null || true
          cp -v bin/targets/mediatek/filogic/sha256sums artifacts/ 2>/dev/null || true
          cp -v bin/targets/mediatek/filogic/profiles.json artifacts/ 2>/dev/null || true
          # Include built kernel modules so they can be installed on this exact firmware
          # (guaranteed matching vermagic since they come from the same build).
          if [ -d bin/targets/mediatek/filogic/packages ]; then
            mkdir -p artifacts/kmods
            cp -v bin/targets/mediatek/filogic/packages/kmod-* artifacts/kmods/ 2>/dev/null || true
          fi
          ls -lhR artifacts/

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netcore-n60-pro-512m-firmware-${{ github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            logs/
            .config
          retention-days: 14
          if-no-files-found: ignore
