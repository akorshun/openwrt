name: Build Nokia XG-040G-MD (2 GB RAM mod)
# Builds airoha/an7581 images for the Nokia XG-040G-MD (UBI layout) from this
# branch, which raises the declared DRAM size from the stock 512 MB to 2 GB.
#
# The output is only correct for boards whose DDR chip has actually been
# replaced with a 2 GB part. On a stock board it hands the kernel memory that
# is not there.
#
# Runs only on tag pushes (or manual dispatch) - never on ordinary pushes to
# the branch: the upstream kernel/packages/toolchain/tools/push-containers
# workflows are excluded for this branch in the same commit that adds this
# file, so nothing else here reacts to a push either. Every run publishes its
# images as a GitHub release.
#
# The tag pattern is deliberately not 'v*': the stock github-release.yml
# inherited from upstream fires on 'v*' and would race this workflow for the
# same release.

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "Verbose make (V=s)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - 'xg-040g-md-2gb-*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # How <0x0 0x80000000 0x0 0x80000000> (2 GiB at 0x80000000) and
  # <0x0 0x80200000 0x0 0x7fe00000> (linux,usable-memory-range: 2 GiB minus the
  # 2 MB ATF reservation) look inside a compiled DTB. Checked after the build,
  # because an override that silently stopped applying would produce images
  # that look fine and still come up with 512 MB.
  REG_2G: "00000000800000000000000080000000"
  USABLE_2G: "0000000080200000000000007fe00000"

jobs:
  build:
    name: airoha/an7581 nokia_xg-040g-md-ubi (2 GB)
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            python3-dev python3 rsync swig unzip zlib1g-dev file wget zstd ccache \
            ecj fastjar java-propose-classpath libelf-dev libncursesw5-dev \
            libdw-dev liblz4-dev libzstd-dev libxml-parser-perl

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build (Nokia XG-040G-MD UBI only)
        run: |
          {
            echo 'CONFIG_TARGET_airoha=y'
            echo 'CONFIG_TARGET_airoha_an7581=y'
            echo 'CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y'
            echo 'CONFIG_PACKAGE_luci=y'
            echo 'CONFIG_BUILD_LOG=y'
          } > .config
          make defconfig

          echo "----- selected target/device -----"
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|ARCH_PACKAGES)' .config || true
          grep -E 'xg-040g-md' .config || true

          # `make defconfig` is free to drop anything it considers unreachable,
          # so check the device survived before spending hours on a build that
          # would produce no image at all.
          grep -qE '^CONFIG_TARGET(_DEVICE)?_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y' .config \
            || { echo "::error::nokia_xg-040g-md-ubi is not selected after defconfig"; exit 1; }
          # LuCI comes from the luci feed, so it only survives defconfig once
          # the feeds are installed. If it silently dropped out the image would
          # ship without a web UI and nothing else here would notice.
          grep -qx 'CONFIG_PACKAGE_luci=y' .config \
            || { echo "::error::CONFIG_PACKAGE_luci did not survive defconfig - is the luci feed installed?"; exit 1; }
          echo "device selected, LuCI included"

      - name: Assert the 2 GB overrides are in the tree
        # Cheap source-level check before the expensive part: this branch is
        # only worth building if both halves of the override are present.
        run: |
          DTSI=target/linux/airoha/dts/an7581-nokia_xg-040g-md-common.dtsi
          UPATCH=package/boot/uboot-airoha/patches/990-nokia-xg-040g-md-2gb-ram-mod.patch
          fail=0
          grep -q 'reg = <0x0 0x80000000 0x0 0x80000000>;' "$DTSI" \
            || { echo "::error::$DTSI does not declare 2 GiB of memory"; fail=1; }
          grep -q '<0x0 0x80200000 0x0 0x7fe00000>' "$DTSI" \
            || { echo "::error::$DTSI does not carry the 2 GiB usable-memory-range"; fail=1; }
          [ -f "$UPATCH" ] \
            || { echo "::error::$UPATCH is missing - U-Boot would still hand the kernel 512 MB"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          echo "source overrides present"

      - name: Assert lan4 is WAN by default
        # Stock upstream puts lan1-4 in one LAN bridge with no WAN interface
        # at all (the board is normally a GPON ONT and uplinks over PON, not
        # copper). This branch instead makes lan4 the default WAN port, so
        # check the board.d script actually says that before spending hours
        # on a build that would ship the stock all-LAN config instead.
        run: |
          NET=target/linux/airoha/an7581/base-files/etc/board.d/02_network
          grep -q 'ucidef_set_interfaces_lan_wan "lan1 lan2 lan3" "lan4"' "$NET" \
            || { echo "::error::$NET does not set lan4 as the default WAN port"; exit 1; }
          echo "lan4-as-WAN default present"

      - name: Download sources
        run: make download -j8

      - name: Build tools
        run: |
          make tools/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make tools/install -j1 V=s

      - name: Build toolchain
        run: |
          make toolchain/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make toolchain/install -j1 V=s

      - name: Build firmware
        run: |
          make -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make -j1 V=s

      - name: Verify the built DTBs really declare 2 GB
        # The kernel DTB and U-Boot's control DTB are the two places that decide
        # how much RAM Linux ends up with; both are checked here so an override
        # that stopped applying cannot ship as a working 2 GB image.
        run: |
          hex() { od -An -tx1 -v "$1" | tr -d ' \n'; }
          fail=0

          KDTB=$(find build_dir -name 'image-an7581-nokia_xg-040g-md-ubi.dtb' 2>/dev/null | head -1)
          if [ -z "$KDTB" ]; then
            echo "::error::kernel DTB not found in build_dir"
            fail=1
          else
            echo "kernel DTB: $KDTB"
            hex "$KDTB" | grep -q "$REG_2G" \
              || { echo "::error::kernel DTB /memory is not 2 GiB"; fail=1; }
            hex "$KDTB" | grep -q "$USABLE_2G" \
              || { echo "::error::kernel DTB linux,usable-memory-range still caps memory below 2 GiB"; fail=1; }
          fi

          UDTB=$(find build_dir -path '*an7581_nokia_xg-040g-md*' \
                   \( -name 'u-boot.dtb' -o -name 'an7581-nokia-xg-040g-md.dtb' \) \
                   2>/dev/null | head -1)
          if [ -z "$UDTB" ]; then
            echo "::error::U-Boot control DTB not found - cannot prove the U-Boot half of the mod applied"
            fail=1
          else
            echo "U-Boot DTB: $UDTB"
            hex "$UDTB" | grep -q "$REG_2G" \
              || { echo "::error::U-Boot DTB /memory is not 2 GiB - it would fix the kernel node back down to 512 MB"; fail=1; }
          fi

          [ "$fail" = 0 ] || exit 1
          echo "both DTBs declare 2 GiB"

      - name: List output
        if: always()
        run: |
          echo "----- bin/targets/airoha/an7581 -----"
          ls -lh bin/targets/airoha/an7581/ || true
          df -h

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp -v bin/targets/airoha/an7581/*xg-040g-md* artifacts/ 2>/dev/null || true
          cp -v bin/targets/airoha/an7581/sha256sums artifacts/ 2>/dev/null || true
          cp -v bin/targets/airoha/an7581/profiles.json artifacts/ 2>/dev/null || true
          cp -v .config artifacts/build.config 2>/dev/null || true
          ls -lh artifacts/
          ls artifacts/ | grep -q 'sysupgrade.itb' \
            || { echo "::error::no sysupgrade image was produced"; exit 1; }
          ls artifacts/ | grep -q 'bl31-uboot.fip' \
            || { echo "::error::no bl31-uboot.fip was produced - the 2 GB fix ships in that file"; exit 1; }

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nokia-xg-040g-md-2gb-${{ github.ref_name }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('xg-040g-md-2gb-build-{0}', github.run_number) }}
          name: Nokia XG-040G-MD - 2 GB RAM mod (${{ github.ref_name }})
          files: artifacts/*
          body: |
            OpenWrt build for the **Nokia XG-040G-MD (UBI)** with the **2 GB RAM mod**.

            **Only for boards whose DDR chip has been physically replaced with a 2 GB
            part.** A stock XG-040G-MD has 512 MB; these images tell the kernel it has
            2 GB, so on an unmodded board they hand it memory that does not exist. Do
            not flash them there.

            Built from `${{ github.sha }}`, branch `main-nokia-xg-040g-md-2gb`.

            ### What differs from a stock build of the same commit

            * kernel DT (`an7581-nokia_xg-040g-md-common.dtsi`): `/memory` raised to
              `<0x0 0x80000000 0x0 0x80000000>` (2 GiB) and `linux,usable-memory-range`
              to `<0x0 0x80200000 0x0 0x7fe00000>` (2 GiB minus the 2 MB ATF
              reservation).
            * U-Boot (`990-nokia-xg-040g-md-2gb-ram-mod.patch`): the same two values in
              the board DT. U-Boot sizes DRAM from its own DT and rewrites the kernel's
              `/memory` node on `bootm`, so without this half the kernel is handed
              512 MB whatever the kernel DT says.

            **Network default also changed:** stock upstream puts all four Ethernet
            ports (lan1-4) in one LAN bridge with no WAN interface at all, since the
            board is normally provisioned as a GPON ONT and uplinks over the PON port
            instead of copper. This build instead sets **lan4 as the default WAN port**
            (DHCP client) and keeps lan1-3 in the LAN bridge
            (`target/linux/airoha/an7581/base-files/etc/board.d/02_network`). Useful if
            you are running this board as a router from a copper uplink rather than as
            an ONT. Reconfigurable afterwards in LuCI or `/etc/config/network` like on
            any other device.

            Also includes **LuCI** (`CONFIG_PACKAGE_luci=y`), which a stock airoha
            build does not ship.

            ### Files

            * `*-squashfs-sysupgrade.itb` - normal sysupgrade image
            * `*-initramfs-recovery.itb` - RAM-only recovery image
            * `*-bl31-uboot.fip` - BL31 plus the patched U-Boot. **This is the file that
              actually unlocks the 2 GB**; flashing only the sysupgrade image leaves the
              board at 512 MB.
            * `*-preloader.bin` - BL2. On this base it is built from source
              (arm-trusted-firmware-airoha 2.10) rather than taken from the prebuilt
              blob the older tree shipped, so it is not the same binary an older
              build put on the board. DDR training lives here: if the modded chip is
              not trained to its full size by BL2, no DT change can help.

            After flashing, U-Boot should print `DRAM:  2 GiB` and `free -m` should
            report roughly 2 GB.

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.ref_name }}
          path: |
            logs/
            .config
          retention-days: 14
          if-no-files-found: ignore
