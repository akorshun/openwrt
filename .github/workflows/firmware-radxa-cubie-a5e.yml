name: Build Radxa Cubie A5E
# Builds firmware for the Radxa Cubie A5E (Allwinner A527, sunxi/cortexa53)
# from OpenWrt v25.12.5.
#
# Runs only on tag pushes (or manual dispatch) — never on ordinary commits or
# pushes to the branch. Every run publishes its images as a GitHub release.
#
# The tag pattern is deliberately not 'v*': the stock github-release.yml
# inherited from upstream fires on 'v*' and would race this workflow for the
# same release.
#
# Builds two variants in parallel: "nanya" (current tree, DRAM timings tuned
# for Nanya 4GB modules) and "classic" (reverts 27dca26 - the DRAM timing
# tuning commit - for older board revisions that need the original timings).
# That revert only touches a U-Boot defconfig, not the kernel config, so both
# variants share the same expected vermagic below.
#
# The build config is seeded from the official buildbot config for this
# release (.github/workflows/config/radxa-cubie-a5e.config) so that the
# kernel config - and therefore the real module ABI - matches the official
# 25.12.5 build as closely as a board that doesn't exist upstream can:
# every CONFIG_KERNEL_* is identical, so the only genuine ABI delta is the
# extra A523 leaf drivers this branch adds.
#
# On its own that still leaves the computed vermagic different from the
# published one (the extra '=m' driver lines change the md5), so the
# 'Force kmod vermagic' step below overrides .vermagic to the published
# value on purpose, to make official kmod-* packages installable here.
# This is the vermagic force that akorshun/openwrt@e67b7e7 reverted on
# mediatek/filogic as unsafe; it is applied here as a deliberate,
# eyes-open choice, and is only defensible because the config match above
# keeps the real ABI delta down to leaf drivers. The step after the build
# asserts the force took effect.

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "Verbose make (V=s)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - 'cubie-a5e-*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Published in targets/sunxi/cortexa53/kmods/ for 25.12.5. The build must
  # arrive at this value on its own; see the vermagic step below.
  EXPECTED_KERNEL: 6.12.94-1
  EXPECTED_VERMAGIC: 54c42a9af64da421c37305c250430d94

jobs:
  build:
    name: sunxi/cortexa53 radxa-a5e (${{ matrix.label }})
    runs-on: ubuntu-24.04
    # GitHub-hosted runners hard-stop at 6 h. CONFIG_ALL_KMODS=y plus the
    # debug info the buildbot config enables makes this a long build.
    timeout-minutes: 350

    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: nanya
            label: "RAM Nanya 4GB"
            revert_dram_patch: false
          - suffix: classic
            label: "Only for old classic revision"
            revert_dram_patch: true

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # actions/checkout defaults to a 1-commit shallow clone, which
          # doesn't include 27dca26 (it's ~12 commits back from HEAD) -
          # `git revert` below needs it reachable locally.
          fetch-depth: 50

      - name: Revert DRAM timing tuning (classic revision only)
        if: matrix.revert_dram_patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git revert --no-edit 27dca26a5f8d2dbf73d814745cc6b86db28e3ea6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            python3-dev python3 rsync swig unzip zlib1g-dev file wget zstd ccache \
            ecj fastjar java-propose-classpath libelf-dev libncursesw5-dev \
            libdw-dev liblz4-dev libzstd-dev libxml-parser-perl libyaml-dev

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build (Radxa Cubie A5E only)
        run: |
          cp .github/workflows/config/radxa-cubie-a5e.config .config
          # Not from the buildbot config, and not a kernel config option:
          # writes per-package logs under logs/ so a failed build is
          # diagnosable from the uploaded artifact.
          echo 'CONFIG_BUILD_LOG=y' >> .config
          make defconfig

          echo "----- Selected target/device -----"
          grep -E '^CONFIG_TARGET_(sunxi|BOARD|ARCH)' .config | head -20
          grep -E '^CONFIG_TARGET.*radxa-a5e' .config

          # `make defconfig` is free to drop anything it considers
          # unreachable, so check the seed survived before spending hours
          # on a build whose kmods would not match the official feed.
          echo "----- Kernel-ABI-relevant options -----"
          fail=0
          grep -qx 'CONFIG_ALL_KMODS=y' .config || { echo "::error::CONFIG_ALL_KMODS lost"; fail=1; }
          grep -qx 'CONFIG_COLLECT_KERNEL_DEBUG=y' .config || { echo "::error::CONFIG_COLLECT_KERNEL_DEBUG lost (selects KERNEL_DEBUG_INFO)"; fail=1; }
          grep -qx 'CONFIG_TARGET_DEVICE_sunxi_cortexa53_DEVICE_radxa_radxa-a5e=y' .config || { echo "::error::device not selected"; fail=1; }
          grep -qx 'CONFIG_PACKAGE_u-boot-radxa-cubie-a5e=y' .config || { echo "::error::u-boot-radxa-cubie-a5e lost"; fail=1; }
          grep -qx 'CONFIG_PACKAGE_trusted-firmware-a-sunxi-a523=y' .config || { echo "::error::trusted-firmware-a-sunxi-a523 lost"; fail=1; }

          # include/kernel-defaults.mk:116 copies every CONFIG_KERNEL_*
          # straight into the kernel config with the prefix stripped, so
          # each one is part of the ABI the official kmods were built
          # against. config.buildinfo is a diffconfig - anything it states
          # explicitly is a deviation from the tree defaults we would
          # otherwise share, so all of it has to be present here too.
          # BUILD_USER/BUILD_DOMAIN are the exception: they only set
          # KBUILD_BUILD_USER/HOST for the version banner, are not kernel
          # config symbols, and are deliberately left at our own values.
          curl -fsSL --retry 3 -o /tmp/config.buildinfo \
            "https://downloads.openwrt.org/releases/25.12.5/targets/sunxi/cortexa53/config.buildinfo"
          { grep -E '^(# )?CONFIG_KERNEL_' /tmp/config.buildinfo \
            | grep -vE 'CONFIG_KERNEL_BUILD_(USER|DOMAIN)' || true; } > /tmp/kernel-opts.want
          echo "official CONFIG_KERNEL_* deviations:"
          cat /tmp/kernel-opts.want
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            grep -qxF "$line" .config || { echo "::error::kernel option differs from the official build: $line"; fail=1; }
          done < /tmp/kernel-opts.want

          [ "$fail" = 0 ] || exit 1
          echo "seed survived defconfig"

      - name: Force kmod vermagic to the published 25.12.5 value
        # Deliberate override, applied on top of the official-config seed
        # above (which already makes every CONFIG_KERNEL_* match, so the
        # only real ABI delta left is the extra A523 leaf drivers this
        # branch adds). Patch the .vermagic computation in
        # include/kernel-defaults.mk so the md5 is replaced by a fixed
        # echo of the official hash - i.e. .vermagic carries the published
        # value from the moment it is written, and every downstream reader
        # (the "kernel" package, the kmod-* packages, distfeeds.list) sees
        # the same thing.
        #
        # WARNING: OpenWrt's generic/hack-6.12/204-module_strip.patch
        # compiles the kernel-side vermagic check out of check_modinfo(),
        # so once this string matches, nothing verifies that an official
        # kmod-* was actually built against a compatible kernel. That is an
        # accepted risk for this build (see the reverted vermagic pin in
        # akorshun/openwrt@e67b7e7 for the full reasoning); it is only
        # tolerable here because the kernel config otherwise matches the
        # official one.
        run: |
          MK=include/kernel-defaults.mk
          # Match the same token the reference hooks.sh keys on: the
          # '$(MKHASH) md5' at the end of the .vermagic pipeline. Replacing
          # it with `echo <hash>` makes that stage ignore its piped stdin
          # and write the fixed hash instead.
          grep -Fq '$(MKHASH) md5 > $(LINUX_DIR)/.vermagic' "$MK" \
            || { echo "::error::vermagic line not found in $MK - refusing to patch blindly"; exit 1; }
          sed -i 's|$(MKHASH) md5 > $(LINUX_DIR)/.vermagic|echo '"$EXPECTED_VERMAGIC"' > $(LINUX_DIR)/.vermagic|' "$MK"
          echo "----- patched line -----"
          grep -n 'vermagic' "$MK"

      - name: Download sources
        run: make download -j8

      - name: Build tools
        run: |
          make tools/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make tools/install -j1 V=s

      - name: Build toolchain
        run: |
          make toolchain/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make toolchain/install -j1 V=s

      - name: Build kernel and modules
        # No -j1 V=s retry here: with CONFIG_ALL_KMODS=y a serial rebuild
        # would not fit in the runner's 6 h budget. logs/ is uploaded on
        # failure instead (CONFIG_BUILD_LOG=y).
        run: |
          make target/linux/compile -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }}

      - name: Assert the forced vermagic took effect
        # After the force step above, .vermagic must read the published
        # value. This is now a check that the patch applied (the token in
        # kernel-defaults.mk could drift in a future OpenWrt bump and the
        # sed would silently no-op), not a check that the config matches
        # on its own - it does not, by design (the A523 leaf drivers make
        # the real hash differ). Placed here because this is the first
        # point at which .vermagic exists.
        run: |
          echo "----- LINUX_VERSION / LINUX_RELEASE -----"
          make --no-print-directory val.LINUX_VERSION val.LINUX_RELEASE 2>/dev/null || true

          VM=$(find build_dir -name '.vermagic' 2>/dev/null | head -1)
          if [ -z "$VM" ]; then
            echo "::error::no .vermagic found in build_dir"
            exit 1
          fi
          ACTUAL=$(cat "$VM")
          echo "vermagic in build:  $ACTUAL"
          echo "expected (forced):  $EXPECTED_VERMAGIC"

          if [ "$ACTUAL" != "$EXPECTED_VERMAGIC" ]; then
            echo "::error::vermagic is $ACTUAL, expected $EXPECTED_VERMAGIC"
            echo "The force step did not take effect - the .vermagic line in"
            echo "include/kernel-defaults.mk probably changed shape upstream."
            echo "Re-check the sed in the 'Force kmod vermagic' step."
            exit 1
          fi
          echo "vermagic OK (forced)"

      - name: Build firmware
        run: |
          make -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }}

      - name: List output
        if: always()
        run: |
          echo "----- bin/targets/sunxi/cortexa53 -----"
          ls -lh bin/targets/sunxi/cortexa53/ || true
          echo "----- disk usage -----"
          df -h

      - name: Verify the shipped kmods feed line
        run: |
          echo "----- generated distfeeds.list -----"
          DF=$(find build_dir -path '*/etc/apk/repositories.d/distfeeds.list' 2>/dev/null | head -1)
          if [ -z "$DF" ]; then
            echo "::error::generated distfeeds.list not found"
            exit 1
          fi
          cat "$DF"

          # target/linux/sunxi/cortexa53/base-files carries this line with a
          # hardcoded kernel version and vermagic; keep it honest.
          WANT="/targets/sunxi/cortexa53/kmods/${EXPECTED_KERNEL}-${EXPECTED_VERMAGIC}/packages.adb"
          if ! grep -qF "$WANT" "$DF"; then
            echo "::error::distfeeds.list does not carry $WANT"
            exit 1
          fi
          echo "kmods feed line OK"

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp -v bin/targets/sunxi/cortexa53/*radxa-a5e* artifacts/ 2>/dev/null || true
          cp -v bin/targets/sunxi/cortexa53/sha256sums artifacts/ 2>/dev/null || true
          cp -v bin/targets/sunxi/cortexa53/profiles.json artifacts/ 2>/dev/null || true
          cp -v .config artifacts/build.config 2>/dev/null || true
          # CONFIG_ALL_KMODS=y means this build produced the whole kmods
          # feed itself. Ship it: same source, same config, same vermagic,
          # so it works offline and does not depend on the feed staying up.
          KDIR=$(find bin/targets/sunxi/cortexa53/kmods -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -1)
          if [ -n "$KDIR" ]; then
            tar -czf "artifacts/kmods-$(basename "$KDIR").tar.gz" -C "$KDIR" .
          fi
          ls -lh artifacts/

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: radxa-cubie-a5e-firmware-${{ github.ref_name }}-${{ matrix.suffix }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && format('{0}-{1}', github.ref_name, matrix.suffix) || format('build-{0}-{1}', github.run_number, matrix.suffix) }}
          name: Radxa Cubie A5E ${{ github.ref_name }} (${{ matrix.label }})
          generate_release_notes: true
          files: artifacts/*

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.ref_name }}-${{ matrix.suffix }}
          path: |
            logs/
            .config
          retention-days: 14
          if-no-files-found: ignore
