name: Build Gemtek XR1710G
# Builds airoha/an7581 images for the Gemtek (Brightspeed) XR1710G from this
# branch: OpenWrt main plus the XR1710G support, modelled on the Gemtek W1700K
# (U-Boot chainloader in the vendor "chainloader" partition, everything else
# in UBI), plus the community fixes for the RTL8261BE 10G links.
#
# Runs only on tag pushes - never on ordinary pushes to the branch: the
# upstream kernel/packages/toolchain/tools/push-containers workflows have this
# branch in branches-ignore. Every run publishes its images as a GitHub
# release.
#
# The tag pattern is deliberately not 'v*': the stock github-release.yml
# inherited from upstream fires on 'v*' and would race this workflow for the
# same release.

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "Verbose make (V=s)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - 'xr1710g-*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE: gemtek_xr1710g-ubi
  TARGET_DIR: bin/targets/airoha/an7581
  DTS: an7581-xr1710g-ubi
  UBOOT: an7581_gemtek_xr1710g

jobs:
  build:
    name: airoha/an7581 gemtek_xr1710g-ubi
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            python3-dev python3 python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget zstd ccache ecj fastjar java-propose-classpath libelf-dev \
            libncursesw5-dev libdw-dev liblz4-dev libzstd-dev libxml-parser-perl \
            device-tree-compiler

      - name: Assert the XR1710G support is in the tree
        # Cheap source-level check before the expensive part.
        run: |
          fail=0
          chk() { [ -e "$1" ] || { echo "::error::missing $1"; fail=1; }; }
          BF=target/linux/airoha/an7581/base-files
          PD=target/linux/airoha/patches-6.18
          chk "target/linux/airoha/dts/${DTS}.dts"
          chk package/boot/uboot-airoha/patches/403-add-gemtek-xr1710g.patch
          for p in 204-pinctrl-airoha-mux-requested-AN7581-pins-as-GPIO \
                   625-net-pcs-airoha-update-USXGMII-rate-adaptation-on-link-up \
                   628-net-pcs-airoha-use-SDK-crossing-search-for-RX-calibration \
                   743-net-phy-realtek-restore-optional-RTK-SerDes-patch \
                   744-net-phy-realtek-reapply-RTK-SerDes-after-aneg; do
            chk "$PD/$p.patch"
          done
          grep -q "^define Device/${DEVICE}$" target/linux/airoha/image/an7581.mk \
            || { echo "::error::an7581.mk has no Device/${DEVICE}"; fail=1; }
          grep -q "ARTIFACT/chainload-uboot.itb := an7581-chainloader gemtek_xr1710g$" \
            target/linux/airoha/image/an7581.mk \
            || { echo "::error::the XR1710G does not build its own chainloader"; fail=1; }
          grep -q "^define U-Boot/${UBOOT}$" package/boot/uboot-airoha/Makefile \
            || { echo "::error::uboot-airoha has no ${UBOOT} variant"; fail=1; }
          grep -qE "^	${UBOOT} \\\\$" package/boot/uboot-airoha/Makefile \
            || { echo "::error::${UBOOT} is not in UBOOT_TARGETS"; fail=1; }
          # A board missing from any of these boots, but with the wrong ports,
          # no U-Boot env access, no fan curve, or a sysupgrade that writes the
          # image the NAND way and bricks the device.
          for f in "$BF/etc/board.d/01_leds" "$BF/etc/board.d/02_network" \
                   "$BF/etc/init.d/airoha_fan" \
                   "$BF/lib/upgrade/platform.sh" \
                   package/boot/uboot-tools/uboot-envtools/files/airoha_an7581; do
            grep -q 'gemtek,xr1710g-ubi' "$f" \
              || { echo "::error::$f has no gemtek,xr1710g-ubi entry"; fail=1; }
          done
          # The case branch of the board inside one function of platform.sh
          branch() {
            awk -v fn="$1" '$0 ~ "^" fn "[(]" { p=1 } p && /gemtek,xr1710g-ubi/ { f=1 } f && /;;/ { exit } f' \
              "$BF/lib/upgrade/platform.sh"
          }
          branch platform_check_image | grep -q fit_check_image \
            || { echo "::error::platform.sh does not check the FIT image of the XR1710G"; fail=1; }
          branch platform_do_upgrade | grep -q fit_do_upgrade \
            || { echo "::error::platform.sh does not use fit_do_upgrade for the XR1710G"; fail=1; }
          [ $(grep -c 'realtek,patch-rtk-serdes;' "target/linux/airoha/dts/${DTS}.dts") = 2 ] \
            || { echo "::error::the DTS does not enable the RTK SerDes patch on both 10G PHYs"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          echo "XR1710G support present"

      - name: Update feeds
        run: |
          # git.openwrt.org answers 504 now and then; a failed clone leaves
          # a half-empty feed behind, so retry the update from scratch.
          for i in 1 2 3 4; do
            ./scripts/feeds update -a && break
            echo "feeds update failed (attempt $i), retrying"
            rm -rf feeds
            sleep 30
          done
          ./scripts/feeds install -a

      - name: Configure build (XR1710G only)
        run: |
          {
            echo 'CONFIG_TARGET_airoha=y'
            echo 'CONFIG_TARGET_airoha_an7581=y'
            echo "CONFIG_TARGET_airoha_an7581_DEVICE_${DEVICE}=y"
            echo 'CONFIG_PACKAGE_luci=y'
            echo 'CONFIG_BUILD_LOG=y'
          } > .config
          make defconfig

          echo "----- selected target/device -----"
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|ARCH_PACKAGES)' .config || true
          grep -E 'xr1710g' .config || true

          fail=0
          # `make defconfig` is free to drop anything it considers unreachable,
          # so check the device survived before spending hours on a build that
          # would produce no image at all.
          grep -qE "^CONFIG_TARGET(_DEVICE)?_airoha_an7581_DEVICE_${DEVICE}=y" .config \
            || { echo "::error::${DEVICE} is not selected after defconfig"; fail=1; }
          grep -qx "CONFIG_PACKAGE_u-boot-${UBOOT}=y" .config \
            || { echo "::error::u-boot-${UBOOT} is not selected - there would be no chainloader"; fail=1; }
          # LuCI comes from the luci feed, so it only survives defconfig once
          # the feeds are installed.
          grep -qx 'CONFIG_PACKAGE_luci=y' .config \
            || { echo "::error::CONFIG_PACKAGE_luci did not survive defconfig - is the luci feed installed?"; fail=1; }
          for p in kmod-phy-realtek rtl826x-firmware kmod-mt7996e kmod-mt7996-firmware \
                   airoha-en7581-mt7996-npu-firmware kmod-hwmon-nct7802 fitblk; do
            grep -qE "^CONFIG_PACKAGE_${p}=[ym]" .config \
              || { echo "::error::${p} is not selected"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1
          echo "device and chainloader selected, LuCI, PHY, Wi-Fi and fan drivers in"

      - name: Download sources
        run: make download -j8

      - name: Build tools
        run: |
          make tools/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make tools/install -j1 V=s

      - name: Build toolchain
        run: |
          make toolchain/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make toolchain/install -j1 V=s

      - name: Prepare the kernel tree
        # Applies the kernel patches. Doing this as its own step means a carried
        # patch that no longer applies fails here, with a readable log, instead
        # of somewhere inside a several-hour build.
        run: |
          make target/linux/prepare -j$(nproc) V=s 2>&1 | tail -80
          KSRC=$(find build_dir/target-* -maxdepth 2 -type d -name 'linux-6.18*' | head -1)
          [ -n "$KSRC" ] || { echo "::error::prepared kernel tree not found"; exit 1; }
          fail=0
          grep -q 'realtek,patch-rtk-serdes' "$KSRC/drivers/net/phy/realtek/realtek_main.c" \
            || { echo "::error::the RTK SerDes patch (743) is not in the tree"; fail=1; }
          grep -q 'Keep the last major value above the target crossing' \
            "$KSRC/drivers/net/pcs/airoha/pcs-an7581.c" \
            || { echo "::error::the PCS RX calibration fix (628) is not in the tree"; fail=1; }
          grep -q 'gpio_request_enable' "$KSRC/drivers/pinctrl/airoha/pinctrl-airoha.c" \
            || { echo "::error::the force-GPIO pinctrl fix (204) is not in the tree"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          echo "carried kernel patches applied"

      - name: Build firmware
        run: |
          make -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make -j1 V=s

      - name: Verify the built DTB
        # The DTB is most of the port. Check the compiled one describes this
        # board, keeps the vendor areas read-only and enables what makes it
        # useful: both 10G PHYs with the SerDes fix, both 1G switch ports and
        # the Wi-Fi.
        run: |
          KDTB=$(find build_dir -name "image-${DTS}.dtb" 2>/dev/null | head -1)
          [ -n "$KDTB" ] || { echo "::error::no image-${DTS}.dtb found in build_dir"; exit 1; }
          echo "DTB: $KDTB"
          dtc -I dtb -O dts "$KDTB" > /tmp/xr1710g.dts 2>/dev/null \
            || { echo "::error::the DTB does not decompile"; exit 1; }
          fail=0
          grep -q 'model = "Gemtek XR1710G (UBI)"' /tmp/xr1710g.dts \
            || { echo "::error::DTB model string is wrong"; fail=1; }
          # dtc prints a string list as "a\0b\0c", so match the first entry only.
          grep -q '^	compatible = "gemtek,xr1710g-ubi\\0' /tmp/xr1710g.dts \
            || { echo "::error::DTB compatible is wrong"; fail=1; }
          for l in vendor chainloader ubi reserved_bmt; do
            grep -q "label = \"$l\"" /tmp/xr1710g.dts \
              || { echo "::error::partition $l is missing"; fail=1; }
          done
          [ $(grep -c 'realtek,patch-rtk-serdes;' /tmp/xr1710g.dts) = 2 ] \
            || { echo "::error::the RTK SerDes patch is not enabled on both 10G PHYs"; fail=1; }
          for n in lan2 wan; do
            grep -q "openwrt,netdev-name = \"$n\"" /tmp/xr1710g.dts \
              || { echo "::error::$n is not named in the DTB"; fail=1; }
          done
          for n in lan3 lan4; do
            grep -q "label = \"$n\"" /tmp/xr1710g.dts \
              || { echo "::error::switch port $n is missing"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1
          echo "DTB describes the XR1710G"

      - name: Verify the chainloader
        # The chainloader is what the vendor bootloader loads from flash. Make
        # sure it is the XR1710G one, with the W1700K-compatible UBI layout.
        run: |
          ITB=$(ls "${TARGET_DIR}"/*gemtek_xr1710g-ubi-chainload-uboot.itb 2>/dev/null | head -1)
          [ -n "$ITB" ] || { echo "::error::no chainload-uboot.itb for the XR1710G"; exit 1; }
          echo "chainloader: $ITB ($(stat -c %s "$ITB") bytes)"
          [ $(stat -c %s "$ITB") -le 1048576 ] \
            || { echo "::error::the chainloader does not fit the 1 MiB chainloader partition"; exit 1; }
          # The staged U-Boot may be LZMA compressed, so check the devicetree
          # it was built with and the uncompressed binary in build_dir.
          UDTB=$(find staging_dir -path '*/image/*' -name "${UBOOT}-u-boot.dtb" 2>/dev/null | head -1)
          [ -n "$UDTB" ] || { echo "::error::no ${UBOOT}-u-boot.dtb in staging_dir"; exit 1; }
          UBIN=$(find build_dir -path "*${UBOOT}*" -name u-boot.bin 2>/dev/null | head -1)
          [ -n "$UBIN" ] || { echo "::error::no u-boot.bin for ${UBOOT} in build_dir"; exit 1; }
          fail=0
          dtc -I dtb -O dts "$UDTB" 2>/dev/null > /tmp/uboot.dts
          grep -q 'model = "Gemtek XR1710G (UBI)"' /tmp/uboot.dts \
            || { echo "::error::U-Boot does not carry the XR1710G devicetree"; fail=1; }
          grep -q 'reg = <0x1be00000 0x4200000>' /tmp/uboot.dts \
            || { echo "::error::U-Boot does not reserve the 66 MiB vendor BMT pool"; fail=1; }
          grep -aq 'gemtek_xr1710g-ubi-initramfs-recovery.itb' "$UBIN" \
            || { echo "::error::U-Boot does not carry the XR1710G environment"; fail=1; }
          grep -aq 'check_buttons=if button reset ; then run boot_tftp_forever' "$UBIN" \
            || { echo "::error::U-Boot does not check the reset button"; fail=1; }
          grep -aq 'serverip=192.168.1.254' "$UBIN" \
            || { echo "::error::U-Boot TFTP server is not 192.168.1.254"; fail=1; }
          for c in CONFIG_PINCTRL_AIROHA_AN7581 CONFIG_BUTTON_GPIO CONFIG_CMD_BUTTON CONFIG_USE_PREBOOT; do
            grep -qx "$c=y" "$(dirname "$UBIN")/.config" \
              || { echo "::error::U-Boot is built without $c"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1
          echo "chainloader is the XR1710G U-Boot"

      - name: List output
        if: always()
        run: |
          echo "----- ${TARGET_DIR} -----"
          ls -lh "${TARGET_DIR}/" || true
          df -h

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp -v "${TARGET_DIR}"/*gemtek_xr1710g* artifacts/ 2>/dev/null || true
          cp -v "${TARGET_DIR}"/sha256sums artifacts/ 2>/dev/null || true
          cp -v "${TARGET_DIR}"/profiles.json artifacts/ 2>/dev/null || true
          cp -v .config artifacts/build.config 2>/dev/null || true
          ls -lh artifacts/
          fail=0
          for f in squashfs-sysupgrade.itb initramfs-recovery.itb chainload-uboot.itb; do
            ls artifacts/ | grep -q -- "$f" \
              || { echo "::error::no $f was produced"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gemtek-xr1710g-${{ github.ref_name }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('xr1710g-build-{0}', github.run_number) }}
          name: Gemtek XR1710G (${{ github.ref_name }})
          files: artifacts/*
          body: |
            OpenWrt build for the **Gemtek / Brightspeed XR1710G** (Airoha AN7581).

            Built from `${{ github.sha }}`, branch `main-gemtek-xr1710g`
            (OpenWrt main plus the board support and the community fixes for the
            RTL8261BE 10G links).

            ### Flash layout

            Same as the Gemtek W1700K "layout 2.0": the vendor bootloader stays,
            the U-Boot chainloader lives in the `chainloader` partition
            (`0x600000`, 1 MiB), OpenWrt lives in UBI (`0x700000`-`0x1be00000`),
            and the vendor BMT pool at the end of flash is left alone.

            ### Installing

            * **Already running OpenWrt in this layout** (vendor / chainloader /
              ubi / reserved_bmt in `/proc/mtd`, e.g. the YYH2913 or naoki66
              chainloader builds): `sysupgrade -n` with
              `*-squashfs-sysupgrade.itb`. With the YYH2913 http-uboot in the
              chainloader slot the same file can be uploaded from its web
              recovery as layout 2.0.
            * **Coming from `xr1710g-r2` ... `xr1710g-r4`**: those set the
              board compat version to 2.0, which was dropped afterwards, so
              sysupgrade refuses the image. Reset it first, then upgrade as
              usual: `uci set system.@system[0].compat_version=1.0 && uci commit system`.
            * **Stock firmware**: over the serial console (115200 8N1), as for
              the W1700K - flash `*-chainload-uboot.itb` to `0x600000` from the
              vendor U-Boot, then boot the UBI installer from
              https://github.com/hurrian/w1700k-ubi-installer via the chainloader
              TFTP menu. The full procedure is in the commit
              "airoha: add support for Gemtek XR1710G" on this branch.

            ### Recovery with the reset button

            The chainloader from this release (it is **not** updated by
            sysupgrade, write `*-chainload-uboot.itb` to the `chainloader`
            partition once) boots the recovery image via TFTP when reset is
            held while it starts:

            1. Give the PC the address `192.168.1.254/24` (`192.168.1.10/24` for the
               chainloader from `xr1710g-r5` ... `xr1710g-r7`), connect it to a LAN
               port and serve `*-initramfs-recovery.itb` from a TFTP server.
            2. Power the router on, press reset **1-2 s later** (held at
               power-on the SoC waits for a UART download instead) and keep it
               pressed until the blue LED lights up, about 15-20 s.
            3. The recovery system comes up at `192.168.1.1`; sysupgrade from
               there.

            Do **not** flash this over the naoki66 "full UBI" layout (`bl2` +
            `ubi` from `0x20000`, replaced bootloader): that layout is different.

            ### Files

            * `*-squashfs-sysupgrade.itb` - sysupgrade image
            * `*-initramfs-recovery.itb` - RAM-only image for the chainloader TFTP menu
            * `*-chainload-uboot.itb` - the U-Boot chainloader for the `chainloader` partition
            * `profiles.json`, `sha256sums`, `build.config` - build metadata

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.ref_name }}
          path: |
            logs/
            .config
          retention-days: 14
          if-no-files-found: ignore
