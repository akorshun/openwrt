name: Build Gemtek XR1710G (Brightspeed) master
# Builds airoha/an7581 images for the Gemtek/Brightspeed XR1710G from this
# branch: OpenWrt master plus the board support and the XR1710G USXGMII/PCS
# stabilization patches carried in target/linux/airoha/patches-6.18/.
#
# Runs only on tag pushes (or manual dispatch) - never on ordinary pushes to
# the branch: the upstream kernel/packages/toolchain/tools/push-containers
# workflows have this branch in branches-ignore. Every successful run
# publishes its images as a GitHub release.
#
# The tag pattern is deliberately not 'v*': the stock github-release.yml
# inherited from upstream fires on 'v*' and would race this workflow for the
# same release.

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "Verbose make (V=s)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - 'xr1710g-*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE: gemtek_xr1710g-ubi
  TARGET_DIR: bin/targets/airoha/an7581

jobs:
  build:
    name: airoha/an7581 gemtek_xr1710g-ubi
    runs-on: ubuntu-24.04
    # GitHub-hosted runners hard-stop at 6 h; the toolchain build dominates.
    timeout-minutes: 350

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            python3-dev python3 rsync swig unzip zlib1g-dev file wget zstd ccache \
            ecj fastjar java-propose-classpath libelf-dev libncursesw5-dev \
            libdw-dev liblz4-dev libzstd-dev libxml-parser-perl

      - name: Assert the XR1710G support is in the tree
        # Cheap source-level check before the expensive part.
        run: |
          fail=0
          chk() { [ -e "$1" ] || { echo "::error::missing $1"; fail=1; }; }
          chk target/linux/airoha/dts/an7581-xr1710g-ubi.dts
          chk package/boot/uboot-airoha/patches/999-airoha-add-gemtek-xr1710g.patch
          chk target/linux/airoha/patches-6.18/204-pinctrl-airoha-mux-requested-AN7581-pins-as-GPIO.patch
          chk target/linux/airoha/patches-6.18/628-net-pcs-airoha-use-SDK-crossing-search-for-RX-calibration.patch
          chk target/linux/airoha/patches-6.18/743-net-phy-realtek-restore-optional-RTK-SerDes-patch.patch
          chk target/linux/airoha/patches-6.18/744-net-phy-realtek-reapply-RTK-SerDes-after-aneg.patch
          grep -q '^define Device/gemtek_xr1710g-ubi$' target/linux/airoha/image/an7581.mk \
            || { echo "::error::an7581.mk has no Device/gemtek_xr1710g-ubi"; fail=1; }
          grep -q 'gemtek,xr1710g-ubi' target/linux/airoha/an7581/base-files/etc/board.d/02_network \
            || { echo "::error::02_network has no gemtek,xr1710g-ubi entry"; fail=1; }
          grep -q 'gemtek,xr1710g-ubi' target/linux/airoha/an7581/base-files/lib/upgrade/platform.sh \
            || { echo "::error::platform.sh has no gemtek,xr1710g-ubi entry"; fail=1; }
          grep -q 'gemtek,xr1710g-ubi' package/boot/uboot-tools/uboot-envtools/files/airoha_an7581 \
            || { echo "::error::uboot-envtools has no gemtek,xr1710g-ubi entry"; fail=1; }
          grep -q 'an7581_gemtek_xr1710g' package/boot/uboot-airoha/Makefile \
            || { echo "::error::uboot-airoha has no an7581_gemtek_xr1710g target"; fail=1; }
          grep -q 'realtek,patch-rtk-serdes' target/linux/airoha/dts/an7581-xr1710g-ubi.dts \
            || { echo "::error::the DTS does not enable the RTK SerDes patch"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          echo "XR1710G support present"

      - name: Update feeds
        run: |
          # git.openwrt.org answers 504 now and then; a failed clone leaves
          # a half-empty feed behind, so retry the update from scratch.
          for i in 1 2 3 4; do
            ./scripts/feeds update -a && break
            echo "feeds update failed (attempt $i), retrying"
            rm -rf feeds
            sleep 30
          done
          ./scripts/feeds install -a

      - name: Stamp the build into the image
        run: |
          mkdir -p files/etc
          {
            echo "release=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > files/etc/xr1710g-release
          cat files/etc/xr1710g-release

      - name: Configure build (XR1710G only, LuCI included)
        run: |
          cp .github/workflows/config/gemtek-xr1710g.config .config
          echo 'CONFIG_BUILD_LOG=y' >> .config
          make defconfig

          echo "----- selected target/device -----"
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|ARCH_PACKAGES)' .config || true
          grep -E 'xr1710g' .config || true

          fail=0
          grep -qE "^CONFIG_TARGET(_DEVICE)?_airoha_an7581_DEVICE_${DEVICE}=y" .config \
            || { echo "::error::${DEVICE} is not selected after defconfig"; fail=1; }
          grep -qx 'CONFIG_PACKAGE_luci=y' .config \
            || { echo "::error::CONFIG_PACKAGE_luci did not survive defconfig - is the luci feed installed?"; fail=1; }
          grep -qE '^CONFIG_PACKAGE_kmod-phy-realtek=[ym]$' .config \
            || { echo "::error::kmod-phy-realtek is not selected"; fail=1; }
          grep -qx 'CONFIG_PACKAGE_rtl826x-firmware=y' .config \
            || { echo "::error::rtl826x-firmware is not selected"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          echo "device selected, LuCI included"

      - name: Download sources
        run: make download -j8

      - name: Build tools
        run: |
          make tools/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make tools/install -j1 V=s

      - name: Build toolchain
        run: |
          make toolchain/install -j$(nproc) \
            ${{ inputs.verbose == 'true' && 'V=s' || '' }} || \
            make toolchain/install -j1 V=s

      - name: Build kernel and modules
        run: make target/linux/compile -j$(nproc) ${{ inputs.verbose == 'true' && 'V=s' || '' }}

      - name: Build firmware
        run: make -j$(nproc) ${{ inputs.verbose == 'true' && 'V=s' || '' }}

      - name: Verify the XR1710G images
        run: |
          fail=0
          KDTB=$(find build_dir -name 'image-an7581-xr1710g-ubi.dtb' 2>/dev/null | head -1)
          if [ -z "$KDTB" ]; then
            echo "::error::kernel DTB image-an7581-xr1710g-ubi.dtb not found"
            fail=1
          else
            for s in 'gemtek,xr1710g-ubi' 'realtek,patch-rtk-serdes' 'usxgmii'; do
              strings "$KDTB" | grep -qx "$s" \
                || { echo "::error::DTB has no '$s' string"; fail=1; }
            done
          fi
          [ "$fail" = 0 ] || exit 1
          echo "device DTB OK"

      - name: List output
        if: always()
        run: |
          echo "----- ${TARGET_DIR} -----"
          ls -lh "${TARGET_DIR}/" || true
          df -h

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp -v "${TARGET_DIR}"/*xr1710g* artifacts/ 2>/dev/null || true
          cp -v "${TARGET_DIR}"/*.manifest artifacts/ 2>/dev/null || true
          cp -v "${TARGET_DIR}"/sha256sums artifacts/ 2>/dev/null || true
          cp -v "${TARGET_DIR}"/profiles.json artifacts/ 2>/dev/null || true
          cp -v .config artifacts/build.config 2>/dev/null || true
          ls -lh artifacts/
          ls artifacts/ | grep -q "${DEVICE}-squashfs-sysupgrade.itb" \
            || { echo "::error::no sysupgrade image was produced"; exit 1; }
          ls artifacts/ | grep -q "${DEVICE}-initramfs-recovery.itb" \
            || { echo "::error::no recovery (initramfs) image was produced"; exit 1; }
          ls artifacts/ | grep -q "${DEVICE}-chainload-uboot.itb" \
            || { echo "::error::no chainload-uboot artifact was produced"; exit 1; }

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gemtek-xr1710g-${{ github.ref_name }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('xr1710g-build-{0}', github.run_number) }}
          name: Gemtek XR1710G (Brightspeed) ${{ github.ref_name }}
          files: artifacts/*
          body: |
            OpenWrt **master** build for the **Gemtek XR1710G (Brightspeed)**, Airoha
            AN7581, 2 GiB RAM, 512 MiB SPI-NAND, MT7996 Wi-Fi 7 (BE19000).

            Built from `${{ github.sha }}`, branch `main-gemtek-xr1710g`: upstream
            master plus the XR1710G board support and the AN7581 PCS/RTL8261BE
            USXGMII stabilization patches (pinctrl force-GPIO muxing, SDK-style PCS
            RX calibration, Realtek host SerDes tuning/retry).

            ### Files

            * `*-chainload-uboot.itb` - the U-Boot chainloader, flashed **first**
              into the vendor `chainloader` partition over UART.
            * `*-initramfs-recovery.itb` - RAM-only image, booted from the
              chainloader bootmenu (TFTP) for installation or recovery.
            * `*-squashfs-sysupgrade.itb` - installed from the running OpenWrt
              (LuCI > System > Backup/Flash Firmware, or `sysupgrade`).

            ### Installing (needs UART)

            1. Open the case (T10 screw under the QR label, pry along the seam) and
               connect a 115200 8n1 serial console to the header next to the screw:
               `TX - GND - VCC - N/A - RX`.
            2. Interrupt the vendor bootloader (press any key), then:
               ```
               setenv serverip 192.168.1.10 ; setenv ipaddr 192.168.1.1
               tftpboot 0x89000000 openwrt-airoha-an7581-gemtek_xr1710g-ubi-chainload-uboot.itb
               setenv one flash read 0x600000 0x100000 $loadaddr
               setenv two "; bootm"
               setenv bootcmd "$one$two"
               saveenv
               flash erase 0x600000 0x100000
               flash write 0x600000 0x100000 0x89000000
               reset
               ```
            3. After the reboot into the chainloader, pick *Boot system via TFTP*
               and load `openwrt-airoha-an7581-gemtek_xr1710g-ubi-initramfs-recovery.itb`
               from 192.168.1.10, then flash the sysupgrade image from the running
               system (it installs into UBI and survives reboots).

            The vendor bootloader is only ever used to write the chainloader
            partition; everything else lives in UBI, so no signed-image checks and
            no vendor BMT/BBT remapping can brick the device.

            ### Known limitations

            * 10G LAN2/WAN need the carried PCS/PHY patches; if a 10G port still
              fails to link after boot, `ifdown lan && sleep 3 && ifup lan` reruns
              the PCS calibration while a permanent fix is being worked on.
            * The UBI installer flow follows the W1700K; the
              `*-initramfs-installer.itb` artifact is not produced by this build.

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.ref_name }}
          path: |
            logs/
            .config
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
